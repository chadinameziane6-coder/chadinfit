<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOOD ON">
<title>MOOD ON · Entreno por mi cuenta</title>
<link rel="icon" href="../icono-192.png">
<link rel="apple-touch-icon" href="../icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#F2F2F5;color:#111;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#111}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.ic{display:block;flex-shrink:0}
.mut{color:#4A4A50}.sm{font-size:13px}.center{text-align:center}.mt{margin-top:12px}
.t1{margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.4px}
h2{margin:0 0 6px;font-size:20px;font-weight:800}
.pant{display:flex;flex-direction:column;gap:12px}
.pad{padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
.pad-tab{padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.con-pie{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.top-esp{height:24px}
.card{background:#fff;border:1px solid #E2E2E8;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-tt{font-size:15px;font-weight:800;padding-bottom:4px}
.enlace{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;width:100%}
.enlace span{display:flex;flex-direction:column;gap:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:26px;background:#111;color:#fff;font-size:16px;font-weight:700;padding:0 18px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#E6E6EB;color:#111}
.btn.rojo{background:#C62828}.btn.verde{background:#0F7A47}
.btn+.btn{margin-top:8px}
.btn-neg{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;border:0;background:#111;color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.btn-o{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid #D6D6DC;background:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.btn-dash{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:48px;border-radius:24px;border:1.5px dashed #9A9AA3;background:transparent;font-size:14px;font-weight:700}
.link{border:0;background:none;padding:8px 2px;font-size:14px;font-weight:700;color:#111;text-decoration:none}
.rojo-t{color:#C62828}.verde-t{color:#0F7A47;display:flex;align-items:center;gap:6px}
.redondo{width:44px;height:44px;border-radius:22px;border:1px solid #E2E2E8;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.redondo.gris{background:#F2F2F5;border:0;width:40px;height:40px}
.redondo.sm{width:34px;height:34px}
.redondo:disabled{opacity:.35}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fila2 .btn+.btn{margin-top:0}
.pie-fijo{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(rgba(242,242,245,0),#F2F2F5 26%);display:flex;flex-direction:column;gap:8px;z-index:5}
.pie-fijo .btn+.btn{margin-top:0}
/* acceso */
.acc{padding:calc(40px + env(safe-area-inset-top)) 22px 40px;display:flex;flex-direction:column;gap:16px}
.acc-top{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-bottom:8px}
.acc-top h1{margin:8px 0 0;font-size:26px;font-weight:800}
.acc-top p{margin:0}
.acc-f{display:flex;flex-direction:column;gap:12px}
.acc-pie{margin-top:10px}
.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#4A4A50}
.f input,.f textarea,.f select{height:50px;border:1px solid #D6D6DC;border-radius:14px;padding:0 14px;font-size:16px;font-weight:600;color:#111;background:#fff;outline:0}
.f input:focus{border-color:#111}
.f input.grande{font-size:18px;font-weight:800;border:1.5px solid #111}
.pw{position:relative;display:flex}.pw input{flex:1;padding-right:48px}
.pw-v{position:absolute;right:4px;top:3px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;color:#4A4A50}
.chk input{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:#111}
.msg{margin:0;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.4}
.msg.err{background:#FDECEC;color:#8E1C1C}.msg.ok{background:#E7F4EC;color:#0B5C35}
.seg2,.seg3{display:grid;grid-template-columns:1fr 1fr;background:#E4E4EA;border-radius:14px;padding:4px;gap:4px}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg2 button,.seg3 button{height:40px;border:0;border-radius:11px;background:transparent;color:#4A4A50;font-size:14px;font-weight:700}
.seg2 button.on,.seg3 button.on{background:#fff;color:#111;font-weight:800}
/* preguntas */
.preg-cab{display:flex;align-items:center;justify-content:space-between}
.barras{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.barras i{height:5px;border-radius:3px;background:#D6D6DC}.barras i.on{background:#111}
.lista-opc{display:flex;flex-direction:column;gap:10px}
.opc{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:62px;padding:12px 16px;border-radius:18px;background:#fff;border:1px solid #E2E2E8;text-align:left}
.opc.on{border:2px solid #111;padding:11px 15px}
.opc span{display:flex;flex-direction:column;gap:2px}.opc b{font-size:16px}.opc small{font-size:13px;color:#5A5A60;line-height:1.4}
.punto{width:22px;height:22px;border-radius:11px;flex-shrink:0;border:2px solid #C6C6CC}
.on>.punto{border:7px solid #111}
.dias7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{height:44px;border-radius:22px;border:1.5px solid #D6D6DC;background:#fff;font-weight:700;padding:0}
.dia.on{background:#111;border-color:#111;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid #D6D6DC;background:#fff;font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.chip.on{background:#111;border-color:#111;color:#fff}
.lab{font-size:15px;font-weight:800;margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* tu plan */
.semana7{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 8px}
.d7{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#6A6A70}
.d7 i{width:34px;height:34px;border-radius:17px;background:#E6E6EB;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.d7.on{color:#111}.d7.on i{background:#111;color:#fff}
.dia-c{padding:4px 14px}
.dia-h{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;background:none;text-align:left}
.dia-h[aria-expanded=true] .ic:last-child{transform:rotate(180deg)}
.letra{width:38px;height:38px;border-radius:19px;background:#111;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dia-t{display:flex;flex-direction:column;flex:1}.dia-t small{font-size:12px;color:#4A4A50}
.cal{background:#F2F2F5;border-radius:12px;padding:8px 10px;font-size:12px;margin-bottom:4px}
.ej-f{display:flex;align-items:center;gap:8px;min-height:48px;border-top:1px solid #ECECF0}
.ej-n{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;flex:1;min-width:0}
.ej-n b{font-size:14px;font-weight:700}.ej-n small{font-size:12px;color:#4A4A50}
.lista{display:flex;flex-direction:column;max-height:60vh;overflow:auto;margin:0 -4px}
.fila-b{display:flex;flex-direction:column;gap:2px;width:100%;padding:12px 4px;border:0;border-top:1px solid #ECECF0;background:none;text-align:left}
.fila-b:first-child{border-top:0}
.fila-b b{font-size:15px}.fila-b small{font-size:12px;color:#4A4A50}
.fila-b.on{background:#F2F2F5;border-radius:12px;padding-left:10px}
/* inicio */
.ini-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px}
.ini-cab span{display:flex;flex-direction:column}
.hoy-c{background:#111;color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hoy-t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hoy-t>span{display:flex;flex-direction:column;gap:4px}
.hoy-t small{font-size:12px;font-weight:700;letter-spacing:.6px;color:#BDBDC4}
.hoy-t b{font-size:22px;font-weight:800}.hoy-t>span>span{font-size:13px;color:#D8D8DE}
.hoy-t em{font-style:normal;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px;white-space:nowrap}
.btn.bl{background:#fff;color:#111;font-weight:800}
.bl2{color:#D8D8DE;align-self:center;padding:0}
.sem7{display:grid;grid-template-columns:repeat(7,1fr)}
.s7{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#6A6A70}
.s7 i{width:30px;height:30px;border-radius:15px;background:#EDEDF1;display:flex;align-items:center;justify-content:center}
.s7.plan{color:#111}.s7.plan i{background:#fff;border:1.5px solid #111}
.s7.ok{color:#111}.s7.ok i{background:#0F7A47}
.s7.hoy{color:#111}.s7.hoy i{background:#fff;border:2px solid #111}
.sem7.osc .s7{color:#BDBDC4}.sem7.osc .s7 i{background:transparent;border:1px solid #4A4A50}
.sem7.osc .s7.plan i{border:1.5px solid #BDBDC4}.sem7.osc .s7.ok i{background:#1FA463;border:0}.sem7.osc .s7.hoy{color:#fff}.sem7.osc .s7.hoy i{border:2px solid #fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:#fff;border:1px solid #E2E2E8;border-radius:16px;padding:10px 4px;text-align:center;display:flex;flex-direction:column}
.card .kpis div{background:#F2F2F5;border:0}
.kpis b{font-size:20px;font-weight:800}.kpis span{font-size:12px;color:#4A4A50}
.fila-r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid #ECECF0}
.fila-r>span:first-child{display:flex;flex-direction:column}
.fila-r small{font-size:12px}
/* mi semana */
.lista-d{padding:2px 14px;gap:0}
.fila-d{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid #ECECF0}
.fila-d:first-child{border-top:0}
.dn{width:40px;font-weight:800;color:#6A6A70}.dn.on{color:#111}
.dt{display:flex;flex-direction:column;flex:1;gap:2px}
.dt .ok{display:flex;align-items:center;gap:4px;color:#0F7A47;font-size:12px;font-weight:700}
.pill{align-self:flex-start;font-size:11px;font-weight:800;background:#111;color:#fff;border-radius:8px;padding:2px 8px}
/* entrenar hoy */
.libre{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;background:#fff;border:1px solid #E2E2E8;text-align:left}
.libre span:last-child{display:flex;flex-direction:column;gap:2px}.libre small{font-size:12px;line-height:1.4;color:#4A4A50}
.libre.on{background:#111;color:#fff;border-color:#111}.libre.on small{color:#D8D8DE}
.li-ic{width:44px;height:44px;border-radius:14px;background:#F2F2F5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.libre.on .li-ic{background:rgba(255,255,255,.14)}
.grupo{padding:10px 14px 4px;gap:0}
.g-t{font-size:12px;font-weight:800;color:#4A4A50;padding-bottom:4px}
.opc2{display:flex;align-items:center;gap:12px;width:calc(100% + 20px);min-height:58px;margin:0 -10px;padding:8px 10px;border-radius:14px;border:0;background:transparent;text-align:left}
.opc2.on{background:#F2F2F5}
.opc2 span{display:flex;flex-direction:column;flex:1}.opc2 small{font-size:12px;color:#4A4A50}
/* mis rutinas */
.lista-rut{padding:12px 14px 4px;gap:0}
.fila-r2{display:flex;align-items:center;gap:12px;min-height:62px;border-top:1px solid #ECECF0}
.fila-r2.sang{padding-left:48px}
.fr-t{display:flex;flex-direction:column;flex:1;min-width:0;gap:2px;border:0;background:none;padding:0;text-align:left}
.fr-t b{font-size:15px}.fr-t small{font-size:12px;color:#4A4A50}
.grupo-b{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:0;border:0;border-top:1px solid #ECECF0;background:none;text-align:left}
.g-ic{width:38px;height:38px;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.giro.on{transform:rotate(180deg)}
.g-acc{display:flex;justify-content:flex-end;gap:12px;padding-bottom:4px}
.ed-ej{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #ECECF0}
.num{width:28px;height:28px;border-radius:9px;background:#F2F2F5;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.ed-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.stp{display:flex;align-items:center;gap:4px;background:#F2F2F5;border-radius:16px;padding:2px}
.stp button{width:28px;height:28px;border-radius:14px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.stp b{min-width:16px;text-align:center;font-size:14px}
.rep{width:58px;height:32px;border:1px solid #D6D6DC;border-radius:10px;text-align:center;font-weight:700;font-size:14px}
.ed-mov{display:flex;flex-direction:column;gap:6px}
.ed-mov .redondo:first-child .ic{transform:rotate(180deg)}
.buscar{display:flex;align-items:center;gap:8px;height:48px;background:#fff;border:1px solid #E2E2E8;border-radius:16px;padding:0 14px}
.buscar input{flex:1;border:0;outline:0;font-size:15px;font-weight:600;background:transparent;min-width:0}
.lista-b{gap:0}
.prog-f{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;border:0;border-top:1px solid #ECECF0;background:none;text-align:left;padding:0}
.pd{width:48px;height:48px;border-radius:14px;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.pd b{font-size:16px}.pd small{font-size:10px;color:#D8D8DE}
.anim-ph{height:170px;border-radius:20px;background:#fff;border:1px solid #E2E2E8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#6A6A70;text-align:center;padding:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;background:#F2F2F5;border-radius:10px;padding:5px 10px}.tag.neg{background:#111;color:#fff}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column}.kv small{font-size:11px;color:#4A4A50}.kv b{font-size:14px}
.txt{margin:0;font-size:14px;line-height:1.5;color:#333}
.grande-n{margin:0;font-size:24px;font-weight:800}
.pronto{border-style:dashed}
/* entreno en curso */
.ses{min-height:100vh}
.ses-cab{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid #E2E2E8;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;flex-direction:column;gap:10px}
.ses-f{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ses-t{display:flex;flex-direction:column;align-items:center;min-width:0}
.ses-t b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.ses-t small{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#4A4A50}
.prog-b{display:flex;gap:4px}.prog-b i{flex:1;height:4px;border-radius:2px;background:#D6D6DC}.prog-b i.ok{background:#0F7A47}.prog-b i.act{background:#111}
.ses-c{padding:12px 12px 130px;display:flex;flex-direction:column;gap:12px}
.cal-c{gap:4px}
.cal-f{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;background:none;text-align:left;width:100%}
.cal-f span:last-child{display:flex;flex-direction:column}.cal-f small{font-size:12px;color:#4A4A50}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid #C6C6CC;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck .ic{opacity:0}.ck.on{background:#0F7A47;border-color:#0F7A47}.ck.on .ic{opacity:1}
.ej-c{flex-direction:row;align-items:center;gap:12px;width:100%;text-align:left}
.ej-h{display:flex;flex-direction:column;gap:2px}.ej-h .ej-n b{font-size:17px;font-weight:800}
.o3{display:grid;grid-template-columns:1fr 1fr;gap:8px}.o3.uno{grid-template-columns:1fr}
.o3>div{display:flex;gap:8px;align-items:center;border-radius:14px;padding:10px 12px}
.o3 span{display:flex;flex-direction:column}.o3 small{font-size:11px}.o3 b{font-size:15px}.o3 i{font-size:11px;font-style:normal;color:#4A4A50}
.o3-h{background:#000;color:#fff}.o3-h small{color:#B8B8BE}
.o3-r{background:#F4F4F6}.o3-r small{color:#4A4A50}
.st-h,.st{display:grid;grid-template-columns:30px 1fr 58px 52px 44px 40px;gap:4px;align-items:center;padding:0 6px}
.st-h{font-size:11px;font-weight:700;color:#4A4A50}
.st{min-height:46px;border-radius:12px;font-size:14px}
.st.ok{background:#E7F4EC}
.st-n{font-weight:800;display:flex;align-items:center;gap:2px}
.st-u{font-size:13px;color:#4A4A50;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st input{width:100%;height:36px;border:1px solid #D6D6DC;border-radius:10px;background:#fff;text-align:center;font-weight:700;font-size:15px;padding:0 2px}
.st.ok input{border-color:transparent;background:transparent}
.st-ok{width:34px;height:34px;border-radius:10px;border:1.5px solid #9A9AA3;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.st-ok.on{background:#0F7A47;border-color:#0F7A47}
.pie-u{margin:2px 0 0;display:flex;gap:6px;align-items:center;font-size:12px;color:#4A4A50}
.nota{margin:0;font-size:12px;line-height:1.45;color:#4A4A50;background:#F7F7F9;border-radius:12px;padding:8px 10px}
.vacio{text-align:center}
.desc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;background:#111;color:#fff;border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:6}
.desc[hidden]{display:none}
