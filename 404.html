<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#111;background:#E9E9EC;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit}
.pg{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-size:16px;font-weight:800;border:0;cursor:pointer;width:100%;background:var(--acc);color:var(--acc-t);transition:transform .15s}
.btn:active{transform:scale(.98)}.btn.out{background:transparent;border:1.5px solid currentColor;color:inherit;font-weight:700;height:50px}
.btn.bl{background:#fff;color:#111}
/* portada oscura */
.hero{position:relative;color:#fff;background:#0B0B0C;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 26px}
.hero .ft{position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 10%,#4A4A4F 0,#1A1A1C 55%,#0B0B0C 100%)}
.hero .ft img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ft:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,.08) 45%,rgba(0,0,0,.92) 100%)}
.top{position:absolute;top:calc(16px + env(safe-area-inset-top));left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.marca{display:flex;flex-direction:column;line-height:1;min-width:0}.marca b{font-size:17px;font-weight:800;letter-spacing:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca span{font-size:9px;font-weight:700;letter-spacing:2.2px;opacity:.75;margin-top:4px;text-transform:uppercase}
.logo{display:inline-flex;align-items:center;max-width:62%}.logo img{display:block;max-height:46px;max-width:100%;object-fit:contain}.hero .logo{background:rgba(255,255,255,.94);border-radius:14px;padding:6px 10px}
.esc{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid rgba(255,255,255,.45);font-size:12px;font-weight:700;white-space:nowrap}

h1{margin:0;font-size:38px;line-height:1.04;font-weight:800;letter-spacing:-1.2px}

.t-claro .top{color:#111}.t-claro .esc{border-color:#DADAE0}.t-claro .pill{background:#F2F2F5}.t-claro .pill i{background:#13915A}.t-claro .eye{color:#6A6A70}

.app{background:#F2F2F5;margin:0 -20px;padding:34px 20px}.tira{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;margin:0 -20px;padding:4px 20px;scrollbar-width:none}.tira::-webkit-scrollbar{display:none}

.opis{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}.opis::-webkit-scrollbar{display:none}
.opi{flex:0 0 272px;scroll-snap-align:start;background:#fff;border:1px solid #E2E2E8;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}.opi.solo{flex-basis:100%}
.opi b.c{font-size:28px;font-weight:800;letter-spacing:-.8px}.opi small{font-size:12px;color:#4A4A50}.opi p{margin:0;font-size:14px;line-height:1.5}.opi .q{font-size:13px;font-weight:700}
.plan{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px;border-radius:22px;cursor:pointer;background:#fff;color:#111;border:1px solid #DADAE0;width:100%}
.plan.on{background:var(--acc);color:var(--acc-t);border:2px solid var(--acc)}.plan .h{display:flex;justify-content:space-between;align-items:center;gap:8px}.plan .h b{font-size:18px;font-weight:800}
.plan .tg{font-size:11px;font-weight:800;height:24px;padding:0 10px;border-radius:12px;display:flex;align-items:center;background:#F2F2F5;color:#4A4A50;white-space:nowrap}.plan.on .tg{background:rgba(255,255,255,.92);color:#111}
.plan .pr{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}.plan .pr b{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1}.plan .pr span{font-size:15px;font-weight:700;opacity:.75}.plan .pr2{display:block;font-size:13px;font-weight:600;opacity:.75;margin-top:-6px}
.plan .pts{display:flex;flex-direction:column;gap:7px;margin-top:2px}.plan .pts>span{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}.plan .pts .ic{width:15px;height:15px;stroke-width:2.6;margin-top:2px;flex:none}
.faq .q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;background:none;border:0;border-bottom:1px solid #E2E2E8;cursor:pointer;text-align:left;font-size:15px;font-weight:700;color:#111}
.faq .q .ic{transition:transform .2s}.faq .q[aria-expanded=true] .ic{transform:rotate(45deg)}.faq .a{margin:0;padding:0 0 16px;font-size:14px;line-height:1.55;color:#3A3A3C;border-bottom:1px solid #E2E2E8;white-space:pre-line}.faq .q[aria-expanded=true]{border-bottom:0}
.fin{background:#0B0B0C;color:#fff;padding:40px 20px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}.fin h2{font-size:32px;letter-spacing:-.9px}.fin p{margin:0;font-size:15px;line-height:1.55;color:#D8D8DE}
.fin .eyb{color:#A0A0A8}.pie{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14)}.pie a{font-size:12px;color:#A0A0A8}
.fin .logo{background:rgba(255,255,255,.94);border-radius:12px;padding:5px 9px}.hecho{font-size:10px;color:#6A6A70;text-align:center;margin-top:6px}
.barra{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:100%;max-width:560px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid #E2E2E8;transition:transform .25s;z-index:10}
.barra.ver{transform:translate(-50%,0)}.barra .btn{height:48px;font-size:15px}.barra a.wa{width:48px;height:48px;border-radius:24px;border:1.5px solid #111;display:flex;align-items:center;justify-content:center;flex:none}
.cargando,.nada{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;color:#4A4A50}
.nada h1{font-size:26px;color:#111;letter-spacing:-.5px}.spin{width:28px;height:28px;border-radius:50%;border:3px solid #E2E2E8;border-top-color:#111;animation:g 1s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
.err{color:#B3261E;font-size:13px;text-align:center;min-height:0}
/* v53.4.132 · vista previa desde el panel (?vista=1): lo mismo, con los datos sin guardar; «solo» = un apartado */
.vt{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);background:#111;color:#fff;font-size:13px;font-weight:700;padding:10px 14px;border-radius:14px;z-index:20;transition:transform .2s;max-width:90%;text-align:center}.vt.ver{transform:translate(-50%,0)}
.flash{position:relative}.flash:after{content:"";position:absolute;inset:0;border:4px solid #E0A100;pointer-events:none;z-index:6;animation:fl 2s ease-out forwards}@keyframes fl{0%,45%{opacity:1}100%{opacity:0}}
.marca-l{display:flex;align-items:center;gap:10px;min-width:0;max-width:72%}.marca-l .logo{max-width:none;flex:none}.marca-l .logo img{max-height:40px;max-width:90px}.marca-l .marca{min-width:0}.marca-l .marca b{font-size:15px;letter-spacing:2px}.marca-l .marca span{font-size:8.5px;letter-spacing:.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t-claro .hero:has(.marca-l){padding-top:calc(76px + env(safe-area-inset-top))}
.v-solo body,body.v-solo{background:#fff}.v-solo .pg{min-height:0;box-shadow:none;max-width:none}.v-solo .cu{padding:26px 20px}
.v-drag{cursor:grab}.v-drag body{-webkit-user-select:none;user-select:none}.v-drag img{-webkit-user-drag:none}.v-drag.arrastra,.v-drag.arrastra *{cursor:grabbing!important}
.vacio{padding:26px 20px;text-align:center;color:#6A6A70;font-size:14px;line-height:1.45;background:#F7F7F9}

/* v53.4.157 (Javier, «Fallos a corregir» 2 y 16: «más visual, más colores, destaca botones» y «que se vea más qué app se usa, sin decirlo»):
   acentos con su color (o, si es negro, los de la app: hielo y lavanda), botones con sombra, etiquetas de apartado, tarjetas tintadas,
   «Todo, en tu móvil» oscuro con los móviles grandes, sus funciones e «Se instala como una app» con el icono de la app. */
.btn{height:56px;border-radius:28px;font-size:16.5px;box-shadow:0 12px 26px var(--acc-s)}.btn .ic{width:20px;height:20px}
.btn .fl{width:30px;height:30px;border-radius:15px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin-right:-10px}.btn .fl .ic{width:17px;height:17px}

.cif{background:var(--tint);border-bottom:0}.cif b{color:var(--vivo-t)}.cif>div+div{border-left-color:rgba(0,0,0,.08)}

<script>
(function(){
  'use strict';
  var LOCAL=/^(localhost|127\.)/.test(location.hostname);
  var API=LOCAL?location.origin+'/api':'https://spmibfqbhgbcomfqlvlc.supabase.co/functions/v1/api';
  var partes=location.pathname.replace(/^\/+|\/+$/g,'').split('/'), slug=String((partes[0]==='landing'?partes[1]:partes[0])||'').toLowerCase();
  var pg=document.getElementById('pg'), P=null, sel=-1;

    if(!SOLO){      // en el ordenador, el móvil de ejemplo también se desliza arrastrando con el ratón (como con el dedo)
      var dg=null, html=document.documentElement; html.classList.add('v-drag');
      addEventListener('dragstart',function(e){ e.preventDefault(); },true);
      addEventListener('pointerdown',function(e){ if(e.pointerType!=='mouse'||e.button!==0) return; dg={y:e.clientY,sy:window.scrollY,mov:false}; },true);
      addEventListener('pointermove',function(e){ if(!dg) return; if(!e.buttons){ dg=null; html.classList.remove('arrastra'); return; }
        var dy=e.clientY-dg.y; if(!dg.mov&&Math.abs(dy)>5){ dg.mov=true; html.classList.add('arrastra'); } if(dg.mov){ window.scrollTo(0,dg.sy-dy); e.preventDefault(); } },true);
      addEventListener('pointerup',function(){ if(dg&&dg.mov){ var f=function(ev){ ev.stopPropagation(); ev.preventDefault(); }; addEventListener('click',f,true); setTimeout(function(){ removeEventListener('click',f,true); },60); }
        dg=null; html.classList.remove('arrastra'); },true);
    }
    document.addEventListener('load',function(e){ if(SOLO&&e.target&&e.target.tagName==='IMG') alto(); },true);
    try{ parent.postMessage({tipo:'mo-vista-lista',solo:SOLO},location.origin); }catch(er){}
    return;
  }
  fetch(API+'/pagina?s='+encodeURIComponent(slug)).then(function(r){ return r.json(); }).then(function(j){
    if(!j||!j.ok||!j.p) return nada();
    P=j.p; pintar(); verBarra();
    ev('v');      // una visita (sin cookies ni nada guardado en su móvil)
  },function(){ pg.innerHTML='<div class="nada"><h1>Sin conexión</h1><p>No se ha podido cargar la página. Prueba otra vez en un momento.</p></div>'; });
})();
