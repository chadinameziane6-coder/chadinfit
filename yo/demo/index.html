<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#F2F2F5;color:#111;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#111}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.ic{display:block;flex-shrink:0}
.mut{color:#4A4A50}.sm{font-size:13px}.center{text-align:center}.mt{margin-top:12px}
.t1{margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.4px}
h2{margin:0 0 6px;font-size:20px;font-weight:800}
.pant{display:flex;flex-direction:column;gap:12px}
.pad{padding:calc(16px + env(safe-area-inset-top)) 16px 28px}

.card{background:#fff;border:1px solid #E2E2E8;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}

.enlace span{display:flex;flex-direction:column;gap:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:26px;background:#111;color:#fff;font-size:16px;font-weight:700;padding:0 18px;text-decoration:none}

.link{border:0;background:none;padding:8px 2px;font-size:14px;font-weight:700;color:#111;text-decoration:none}

/* acceso */

/* tu plan */
.semana7{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 8px}

.dia-c{padding:4px 14px}

.lista{display:flex;flex-direction:column;max-height:60vh;overflow:auto;margin:0 -4px}

/* inicio */

.hoy-t em{font-style:normal;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px;white-space:nowrap}
.btn.bl{background:#fff;color:#111;font-weight:800}
.bl2{color:#D8D8DE;align-self:center;padding:0}
.sem7{display:grid;grid-template-columns:repeat(7,1fr)}
.s7{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#6A6A70}

.sem7.osc .s7{color:#BDBDC4}.sem7.osc .s7 i{background:transparent;border:1px solid #4A4A50}
.sem7.osc .s7.plan i{border:1.5px solid #BDBDC4}.sem7.osc .s7.ok i{background:#1FA463;border:0}.sem7.osc .s7.hoy{color:#fff}.sem7.osc .s7.hoy i{border:2px solid #fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:#fff;border:1px solid #E2E2E8;border-radius:16px;padding:10px 4px;text-align:center;display:flex;flex-direction:column}
.card .kpis div{background:#F2F2F5;border:0}
.kpis b{font-size:20px;font-weight:800}.kpis span{font-size:12px;color:#4A4A50}
.fila-r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid #ECECF0}
.fila-r>span:first-child{display:flex;flex-direction:column}
.fila-r small{font-size:12px}
/* mi semana */
.lista-d{padding:2px 14px;gap:0}
.fila-d{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid #ECECF0}
.fila-d:first-child{border-top:0}
.dn{width:40px;font-weight:800;color:#6A6A70}.dn.on{color:#111}
.dt{display:flex;flex-direction:column;flex:1;gap:2px}
.dt .ok{display:flex;align-items:center;gap:4px;color:#0F7A47;font-size:12px;font-weight:700}

/* entrenar hoy */
.libre{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;background:#fff;border:1px solid #E2E2E8;text-align:left}
.libre span:last-child{display:flex;flex-direction:column;gap:2px}.libre small{font-size:12px;line-height:1.4;color:#4A4A50}
.libre.on{background:#111;color:#fff;border-color:#111}.libre.on small{color:#D8D8DE}
.li-ic{width:44px;height:44px;border-radius:14px;background:#F2F2F5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.libre.on .li-ic{background:rgba(255,255,255,.14)}
.grupo{padding:10px 14px 4px;gap:0}
.g-t{font-size:12px;font-weight:800;color:#4A4A50;padding-bottom:4px}
.opc2{display:flex;align-items:center;gap:12px;width:calc(100% + 20px);min-height:58px;margin:0 -10px;padding:8px 10px;border-radius:14px;border:0;background:transparent;text-align:left}
.opc2.on{background:#F2F2F5}
.opc2 span{display:flex;flex-direction:column;flex:1}.opc2 small{font-size:12px;color:#4A4A50}
/* mis rutinas */
.lista-rut{padding:12px 14px 4px;gap:0}
.fila-r2{display:flex;align-items:center;gap:12px;min-height:62px;border-top:1px solid #ECECF0}
.fila-r2.sang{padding-left:48px}
.fr-t{display:flex;flex-direction:column;flex:1;min-width:0;gap:2px;border:0;background:none;padding:0;text-align:left}
.fr-t b{font-size:15px}.fr-t small{font-size:12px;color:#4A4A50}
.grupo-b{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:0;border:0;border-top:1px solid #ECECF0;background:none;text-align:left}
.g-ic{width:38px;height:38px;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.giro.on{transform:rotate(180deg)}
.g-acc{display:flex;justify-content:flex-end;gap:12px;padding-bottom:4px}
.ed-ej{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #ECECF0}
.num{width:28px;height:28px;border-radius:9px;background:#F2F2F5;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.ed-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.stp{display:flex;align-items:center;gap:4px;background:#F2F2F5;border-radius:16px;padding:2px}
.stp button{width:28px;height:28px;border-radius:14px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.stp b{min-width:16px;text-align:center;font-size:14px}
.rep{width:58px;height:32px;border:1px solid #D6D6DC;border-radius:10px;text-align:center;font-weight:700;font-size:14px}
.ed-mov{display:flex;flex-direction:column;gap:6px}
.ed-mov .redondo:first-child .ic{transform:rotate(180deg)}
.buscar{display:flex;align-items:center;gap:8px;height:48px;background:#fff;border:1px solid #E2E2E8;border-radius:16px;padding:0 14px}
.buscar input{flex:1;border:0;outline:0;font-size:15px;font-weight:600;background:transparent;min-width:0}
.lista-b{gap:0}
.prog-f{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;border:0;border-top:1px solid #ECECF0;background:none;text-align:left;padding:0}
.pd{width:48px;height:48px;border-radius:14px;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.pd b{font-size:16px}.pd small{font-size:10px;color:#D8D8DE}
.anim-ph{height:170px;border-radius:20px;background:#fff;border:1px solid #E2E2E8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#6A6A70;text-align:center;padding:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;background:#F2F2F5;border-radius:10px;padding:5px 10px}.tag.neg{background:#111;color:#fff}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column}.kv small{font-size:11px;color:#4A4A50}.kv b{font-size:14px}
.txt{margin:0;font-size:14px;line-height:1.5;color:#333}
.grande-n{margin:0;font-size:24px;font-weight:800}
.pronto{border-style:dashed}
/* entreno en curso */
.ses{min-height:100vh}
.ses-cab{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid #E2E2E8;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;flex-direction:column;gap:10px}
.ses-f{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ses-t{display:flex;flex-direction:column;align-items:center;min-width:0}
.ses-t b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.ses-t small{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#4A4A50}
.prog-b{display:flex;gap:4px}.prog-b i{flex:1;height:4px;border-radius:2px;background:#D6D6DC}.prog-b i.ok{background:#0F7A47}.prog-b i.act{background:#111}
.ses-c{padding:12px 12px 130px;display:flex;flex-direction:column;gap:12px}
.cal-c{gap:4px}
.cal-f{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;background:none;text-align:left;width:100%}
.cal-f span:last-child{display:flex;flex-direction:column}.cal-f small{font-size:12px;color:#4A4A50}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid #C6C6CC;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck .ic{opacity:0}.ck.on{background:#0F7A47;border-color:#0F7A47}.ck.on .ic{opacity:1}
.ej-c{flex-direction:row;align-items:center;gap:12px;width:100%;text-align:left}
.ej-h{display:flex;flex-direction:column;gap:2px}.ej-h .ej-n b{font-size:17px;font-weight:800}
.o3{display:grid;grid-template-columns:1fr 1fr;gap:8px}.o3.uno{grid-template-columns:1fr}

.o3-r{background:#F4F4F6}.o3-r small{color:#4A4A50}

.st.ok input{border-color:transparent;background:transparent}

.st-ok.on{background:#0F7A47;border-color:#0F7A47}
.pie-u{margin:2px 0 0;display:flex;gap:6px;align-items:center;font-size:12px;color:#4A4A50}
.nota{margin:0;font-size:12px;line-height:1.45;color:#4A4A50;background:#F7F7F9;border-radius:12px;padding:8px 10px}
.vacio{text-align:center}
.desc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;background:#111;color:#fff;border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:6}
.desc[hidden]{display:none}

/* la gráfica: los días en gris y la media de cada semana en negro */
function grafPeso(P, semanas) {
  var W = 340, H = 150, pl = 34, pr = 8, pt = 10, pb = 22, hoy = hoyStr(), desde = sumar(lunesDe(hoy), -7 * (semanas - 1));
  var L = P.filter(function (x) { return x.fecha >= desde; }); if (!L.length) L = P.slice(-1);
  var t0 = aDate(desde).getTime(), t1 = aDate(sumar(lunesDe(hoy), 6)).getTime(), tx = function (f) { return pl + (aDate(f).getTime() - t0) / (t1 - t0) * (W - pl - pr); };
  var S2 = {}; L.forEach(function (x) { var k = lunesDe(x.fecha); (S2[k] = S2[k] || []).push(num(x.peso)); });
  var M = Object.keys(S2).sort().map(function (k) { var a = S2[k]; return { f: sumar(k, 3), v: a.reduce(function (s, y) { return s + y; }, 0) / a.length }; });
  var vals = L.map(function (x) { return num(x.peso); }), mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mx - mn < 2) { var c = (mx + mn) / 2; mn = c - 1; mx = c + 1; } var pad = (mx - mn) * 0.15; mn -= pad; mx += pad;
  var ty = function (v) { return pt + (mx - v) / (mx - mn) * (H - pt - pb); };

  [0, 0.5, 1].forEach(function (q) { var v = mx - (mx - mn) * q, y = ty(v); g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#ECECF0"/><text x="' + (pl - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + kg1(v) + '</text>'; });
  g += '<text x="' + pl + '" y="' + (H - 6) + '">' + esc(fCorta(desde)) + '</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">hoy</text>';
  L.forEach(function (x) { g += '<circle cx="' + tx(x.fecha).toFixed(1) + '" cy="' + ty(num(x.peso)).toFixed(1) + '" r="3" fill="#B9B9C2"><title>' + esc(fCorta(x.fecha)) + ': ' + kg1(num(x.peso)) + ' kg</title></circle>'; });
  if (M.length > 1) g += '<polyline fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + M.map(function (m) { return tx(m.f).toFixed(1) + ',' + ty(m.v).toFixed(1); }).join(' ') + '"/>';
  M.forEach(function (m) { g += '<circle cx="' + tx(m.f).toFixed(1) + '" cy="' + ty(m.v).toFixed(1) + '" r="3.5" fill="#111"><title>Semana del ' + esc(fCorta(sumar(m.f, -3))) + ': ' + kg1(m.v) + ' kg de media</title></circle>'; });
  return g + '</svg>';
}

      (c.borrable ? '<button class="redondo gris sm" data-a="cBorrarCom" data-id="' + c.id + '" aria-label="Borrar el comentario">' + ic('papelera', 15) + '</button>' : '<button class="redondo gris sm" data-a="cDenCom" data-id="' + c.id + '" data-n="' + esc(c.nombre) + '" aria-label="Denunciar el comentario">' + ic('bandera', 15) + '</button>') + '</div>'; }).join('') + '</section>';
  h += '<p class="mut sm center">Con respeto. Lo que no cumpla las normas se puede denunciar.</p>';
  h += '<form class="pie-fijo cm-escribe" data-f="cComentar"><input name="t" maxlength="300" data-in="cTxt" value="' + esc(K.txt || '') + '" placeholder="Escribe un comentario…" autocomplete="off" aria-label="Escribe un comentario"><button class="btn-neg" type="submit">Enviar</button></form>';
  return h + '</div>';
};
IN.cTxt = function (t) { var K = CMU().coms; if (K) K.txt = t.value; };
F.cComentar = function (f) {
  var C = CMU(), K = C.coms, i = f.elements.t, t = String(i.value || '').trim(), b = f.querySelector('button'); if (!K || !t || K.env) return;
  K.env = 1; b.disabled = true;
  rpc('yo_comu_comentar', { pub: K.id, texto: t }).then(function (r) { K.env = 0; K.L = r || []; K.txt = ''; cadaPub(K.id, function (p) { p.coms = K.L.length; }); pintar(); },
    function (e) { K.env = 0; b.disabled = false; toast(cErr(e)); });
};
A.cBorrarCom = function (el) {
  var C = CMU(), K = C.coms, id = +el.dataset.id; if (!K || el.disabled) return; el.disabled = true;
  rpc('yo_comu_borrar_com', { com: id }).then(function () { K.L = (K.L || []).filter(function (c) { return c.id !== id; }); cadaPub(K.id, function (p) { p.coms = K.L.length; }); toast('Comentario borrado'); pintar(); },
    function (e) { el.disabled = false; toast(cErr(e)); });
};

/* ---------- el perfil de una persona ---------- */
A.cPersona = function (el) {
  var C = CMU(), pid = el.dataset.p; if (!pid) return; C.menu = null;
  if (!C.pers[pid]) C.pers[pid] = { pid: pid };
  ir({ t: 'comuPersona', p: pid }); cargaPersona(pid);
};
function cargaPersona(pid) {
  var C = CMU(); C.pers[pid].err = '';
  rpc('yo_comu_persona', { p: pid }).then(function (r) { C.pers[pid] = r; repintaComu(); }, function (e) { if (C.pers[pid]) C.pers[pid].err = cErr(e); repintaComu(); });
}
A.cPersonaRe = function () { if (S.pant && S.pant.p) cargaPersona(S.pant.p); };
VISTAS.comuPersona = function (p) {
  var C = CMU(), P = C.pers[p.p] || { pid: p.p }, nom = P.nombre || '';
  var h = '<div class="pant pad">' + cab(esc(nom || 'Comunidad'), { der: nom && !P.yo ? '<button class="redondo" data-a="cPerMenu" aria-label="Más opciones">' + ic('dots', 18) + '</button>' : '' });
  if (!P.pubs) return h + (P.err ? errCard(P.err, 'cPersonaRe') : CARGANDO) + '</div>';
  var nS = P.seguidores || 0, L = P.pubs.filter(noOculta);
  h += '<section class="card cm-perfil"><span class="cm-av gr">' + esc(iniciales(nom)) + '</span><span class="fr-t"><b>' + esc(nom) + (P.yo ? ' <span class="mio">TÚ</span>' : '') + '</b><small>' + nS + (nS === 1 ? ' seguidor' : ' seguidores') + ' · ' + P.pubs.length + (P.pubs.length >= 20 ? '+' : '') + (P.pubs.length === 1 ? ' entreno compartido' : ' entrenos compartidos') + '</small></span></section>';
  if (P.yo) h += '<button class="btn sec" data-a="cAjustes">' + ic('ajustes', 18) + 'Tu nombre, bloqueos y salir</button>';
  else h += P.sigo ? '<button class="btn sec" data-a="cDejar" data-p="' + esc(P.pid) + '" data-n="' + esc(nom) + '">' + ic('check', 18) + 'Siguiendo · dejar de seguir</button>' : '<button class="btn" data-a="cSeguir" data-p="' + esc(P.pid) + '" data-n="' + esc(nom) + '">Seguir a ' + esc(nom1(nom)) + '</button>';
  if (P.silencio) h += '<section class="card cm-aviso"><small>Has silenciado a ' + esc(nom1(nom)) + ': sus entrenos no te salen en Comunidad.</small><button class="link izq" data-a="cQuitarSil" data-p="' + esc(P.pid) + '">Quitar el silencio</button></section>';
  h += L.length ? L.map(function (x) { return cardPub(x); }).join('') : '<p class="mut center sm">' + (P.yo ? 'Todavía no has publicado ningún entreno. Al terminar uno, pulsa «Publicar en la Comunidad».' : 'Todavía no ha compartido ningún entreno.') + '</p>';
  return h + '</div>';
};
A.cPerMenu = function () {
  var P = CMU().pers[S.pant && S.pant.p]; if (!P) return; var n = esc(nom1(P.nombre)), a = ' data-p="' + esc(P.pid) + '" data-n="' + esc(P.nombre) + '"';
  hoja('<h2>' + esc(P.nombre) + '</h2>' + (P.silencio ? '<button class="btn sec" data-a="cQuitarSilH"' + a + '>Quitar el silencio</button>' : '<button class="btn sec" data-a="cSilenciar"' + a + '>Silenciar a ' + n + '</button>') +
    '<button class="btn rojo" data-a="cBloquear"' + a + '>Bloquear a ' + n + '</button><button class="btn sec" data-a="cerrarHoja">Cancelar</button>');
};
A.cQuitarSilH = function (el) { cerrarHoja(); A.cQuitarSil(el); };

/* ---------- buscar personas ---------- */
var cBusT;
A.cBuscar = function () { var C = CMU(); C.bus = { q: '', L: C.gente ? C.gente.slice() : null }; ir({ t: 'comuBuscar' }); if (!C.bus.L) cBusca(''); setTimeout(function () { var i = $('#cb-q'); if (i) i.focus(); }, 60); };
VISTAS.comuBuscar = function () {
  var B = CMU().bus || { q: '', L: [] };
  return '<div class="pant pad">' + cab('Buscar personas') + '<label class="cm-bus">' + ic('buscar', 18) + '<input id="cb-q" data-in="cBusQ" value="' + esc(B.q) + '" placeholder="Busca por nombre" autocomplete="off" aria-label="Busca por nombre" maxlength="30"></label><div id="cb-res">' + busRes(B) + '</div></div>';
};
function busRes(B) {
  if (B.err) return '<p class="mut center sm">' + esc(B.err) + '</p>';
  if (B.L === null) return CARGANDO;
  if (!B.L.length) return '<p class="mut center sm">' + (B.q.trim() ? 'No hay nadie con ese nombre en Comunidad' : 'Ya sigues a todo el mundo. Busca por nombre para encontrar a alguien.') + '</p>';
  return '<section class="card cm-lista">' + B.L.map(filaGente).join('') + '</section>';
}
function pintaBus() { var el = $('#cb-res'), B = CMU().bus; if (el && B) el.innerHTML = busRes(B); }
function cBusca(q) { var B = CMU().bus; B.err = ''; rpc('yo_comu_gente', { q: q }).then(function (r) { if (!CMU().bus || B.q !== q) return; B.L = r || []; pintaBus(); }, function (e) { B.err = cErr(e); pintaBus(); }); }
IN.cBusQ = function (t) { var B = CMU().bus; if (!B) return; B.q = t.value; clearTimeout(cBusT); cBusT = setTimeout(function () { cBusca(B.q); }, 350); };

/* ---------- activar (primera vez o volver) ---------- */
function vActivar(pant) {
  var C = CMU(), e = C.est, nom = C.actNom != null ? C.actNom : (e && e.nombre) || nombreSug();
  var fila = function (k, t) { return '<span class="cm-si">' + (k ? ic('check', 15, '#0F7A47', 2.6) : ic('x', 15, '#C62828', 2.6)) + '<span>' + t + '</span></span>'; };
  var h = pant ? cab('Comunidad') : '<div class="ini-cab"><h1 class="t1">Comunidad</h1></div>';
  h += '<section class="card cm-hola"><span class="cm-ic">' + ic('comu', 26) + '</span><b>' + (e ? 'Vuelve a la Comunidad' : 'Entrena con más gente') + '</b><p class="mut sm">Sigue a otras personas, publica tus entrenos y copia sus rutinas. Es voluntario: solo entras si quieres, y puedes salir cuando quieras.</p></section>';
  h += '<section class="card"><b>Qué verán los demás</b><div class="cm-sis">' + fila(1, 'El nombre que elijas aquí abajo') + fila(1, 'Los entrenos que tú publiques: duración, series, kilos, tu récord y los ejercicios') + '</div>' +
    '<b class="mt">Lo que nunca sale</b><div class="cm-sis">' + fila(0, 'Tu peso y tus medidas') + fila(0, 'Tus fotos de progreso') + fila(0, 'Lo que comes y tus calorías') + fila(0, 'Tu email y los entrenos que no publiques') + '</div></section>';
  h += '<form class="card" data-f="cActivar"><label class="f">Tu nombre en Comunidad<input name="n" maxlength="30" value="' + esc(nom) + '" data-in="cActNom" placeholder="Por ejemplo: Laura M." autocomplete="off"></label><small class="mut">Mejor tu nombre y la inicial del apellido. Puedes cambiarlo cuando quieras.</small>' +
    '<div class="cm-normas"><b>Normas de la Comunidad</b><ul>' + NORMAS.map(function (n) { return '<li>' + n + '</li>'; }).join('') + '</ul></div>' +
    '<label class="chk"><input type="checkbox" name="ok" data-ch="cActOk"' + (C.actOk ? ' checked' : '') + '><span>He leído y acepto las <a href="../../condiciones.html#comunidad" target="_blank" rel="noopener">normas de la Comunidad</a></span></label>' +
    '<button class="btn" type="submit" id="ca-go"' + (C.actOk ? '' : ' disabled') + '>' + (e ? 'Volver a la Comunidad' : 'Activar Comunidad') + '</button></form>';
  return h;
}
VISTAS.comuActivar = function () { return '<div class="pant pad">' + vActivar(true) + '</div>'; };
IN.cActNom = function (t) { CMU().actNom = t.value; };
CH.cActOk = function (t) { CMU().actOk = t.checked; var b = $('#ca-go'); if (b) b.disabled = !t.checked; };
F.cActivar = function (f) {
  var C = CMU(), n = String(f.elements.n.value || '').replace(/\s+/g, ' ').trim(), b = $('#ca-go');
  if (!f.elements.ok.checked) return toast('Acepta las normas de la Comunidad');
  if (n.length < 2 || n.length > 30 || !NOM_RE.test(n)) return toast('Escribe un nombre de 2 a 30 letras (sin números ni símbolos)');
  var vuelve = !!C.est; b.disabled = true; b.textContent = 'Un momento…';
  rpc('yo_comu_activar', { nombre: n, normas: COMU_NV }).then(function (e) {
    C.est = e; olvidaFeeds(); C.actNom = null; C.actOk = false; C.tab = vuelve ? 's' : 'd';
    toast(vuelve ? 'Has vuelto a la Comunidad' : 'Ya estás en la Comunidad', 'ok');
    if (S.pant && S.pant.t === 'comuActivar') { volver(); if (S.fin) A.finComu(); } else { arriba(); pintar(); }
  }, function (e) { b.disabled = false; b.textContent = vuelve ? 'Volver a la Comunidad' : 'Activar Comunidad'; toast(cErr(e)); });
};
A.cIrActivar = function () { cerrarHoja(); ir({ t: 'comuActivar' }); };

/* ---------- tu Comunidad: nombre, bloqueos, normas, salir y borrar ---------- */
A.cAjustes = function () { ir({ t: 'comuAjustes' }); };
VISTAS.comuAjustes = function () {
  var e = CMU().est || {}, B = e.bloqueados || [];
  var h = '<div class="pant pad">' + cab('Tu Comunidad');
  h += '<div class="kpis k3">' + [[e.pubs || 0, (e.pubs === 1 ? 'publicación' : 'publicaciones')], [e.siguiendo || 0, 'siguiendo'], [e.seguidores || 0, (e.seguidores === 1 ? 'seguidor' : 'seguidores')]].map(function (k) { return '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('') + '</div>';
  h += '<form class="card" data-f="cNombre"><label class="f">Tu nombre en Comunidad<input name="n" maxlength="30" value="' + esc(e.nombre || '') + '" autocomplete="off"></label><small class="mut">Es lo único tuyo que ven los demás, junto a lo que publiques.</small><button class="btn sec" type="submit">Guardar el nombre</button></form>';
  h += '<b class="tit-sec">PERSONAS BLOQUEADAS</b><section class="card cm-lista">' + (B.length ? B.map(function (b) {
    return '<div class="cm-fila"><span class="cm-av">' + esc(iniciales(b.nombre)) + '</span><span class="fr-t"><b>' + esc(b.nombre) + '</b></span><button class="btn-o" data-a="cDesbloquear" data-p="' + esc(b.pid) + '">Desbloquear</button></div>'; }).join('') : '<small class="mut">No has bloqueado a nadie.</small>') + '</section>';
  h += '<b class="tit-sec">NORMAS Y PRIVACIDAD</b><section class="card"><a class="fila-b" href="../../condiciones.html#comunidad" target="_blank" rel="noopener"><b>Normas de la Comunidad</b><small>Las aceptaste al entrar</small></a><a class="fila-b" href="../../privacidad.html#yo" target="_blank" rel="noopener"><b>Qué ven los demás</b><small>Política de privacidad</small></a></section>';
  h += '<b class="tit-sec">SALIR</b><section class="card"><button class="fila-b" data-a="cDesactivar"><b>Salir de Comunidad</b><small>Tus publicaciones dejan de verse. Puedes volver cuando quieras.</small></button><button class="fila-b rojo" data-a="cBorrarTodo"><b>Borrar todo lo mío en Comunidad</b><small>Publicaciones, comentarios, me gusta y a quién sigues</small></button></section>';
  return h + '</div>';
};
F.cNombre = function (f) {
  var C = CMU(), n = String(f.elements.n.value || '').replace(/\s+/g, ' ').trim(), b = f.querySelector('button');
  if (n.length < 2 || n.length > 30 || !NOM_RE.test(n)) return toast('Escribe un nombre de 2 a 30 letras (sin números ni símbolos)');
  if (C.est && n === C.est.nombre) return toast('Ese ya es tu nombre');
  b.disabled = true;
  rpc('yo_comu_activar', { nombre: n, normas: (C.est && C.est.normas) || COMU_NV }).then(function (e) { C.est = e; olvidaFeeds(); C.pers = {}; toast('Nombre guardado', 'ok'); pintar(); }, function (e) { b.disabled = false; toast(cErr(e)); });
};
A.cDesactivar = function () {
  hoja('<h2>¿Salir de Comunidad?</h2><p class="mut">Tus publicaciones y tu nombre dejan de verse, y no verás la Comunidad. No se borra nada: si vuelves, estará todo como lo dejaste.</p><button class="btn" data-a="cDesactivarSi">Salir de Comunidad</button><button class="btn sec" data-a="cerrarHoja">Cancelar</button>');
};
A.cDesactivarSi = function (el) {
  var C = CMU(); if (el.disabled) return; el.disabled = true;
  rpc('yo_comu_desactivar').then(function (e) { cerrarHoja(); C.est = e; olvidaFeeds(); C.pers = {}; irTab('comu'); toast('Has salido de Comunidad'); }, function (e) { el.disabled = false; toast(cErr(e)); });
};
A.cBorrarTodo = function () {
  hoja('<h2>¿Borrar todo lo tuyo en Comunidad?</h2><p class="mut">Se borra al momento y <b>no se puede recuperar</b>:</p><div class="borra-l">' +
    ['Tus publicaciones, con sus comentarios y me gusta', 'Tus comentarios y tus me gusta', 'A quién sigues y quién te sigue', 'Tu nombre en Comunidad'].map(function (t) { return '<span>' + ic('x', 15, '#C62828', 2.6) + '<span>' + t + '</span></span>'; }).join('') +
    '</div><p class="mut sm">Tus entrenos, tus rutinas y tu progreso no se tocan.</p><label class="chk"><input type="checkbox" id="cbt-ok" data-ch="cbtOk"><span>Entiendo que no se puede deshacer</span></label>' +
    '<button class="btn rojo" id="cbt-go" data-a="cBorrarTodoSi" disabled>Borrar todo lo mío en Comunidad</button><button class="btn sec" data-a="cerrarHoja">Cancelar</button>');
};
CH.cbtOk = function (t) { var b = $('#cbt-go'); if (b) b.disabled = !t.checked; };
A.cBorrarTodoSi = function (el) {
  if (!$('#cbt-ok') || !$('#cbt-ok').checked || el.disabled) return; el.disabled = true; el.textContent = 'Borrando…';
  rpc('yo_comu_borrar_todo').then(function () { cerrarHoja(); S.comu = null; CMU().est = null; irTab('comu'); toast('Hemos borrado todo lo tuyo en Comunidad'); },
    function (e) { el.disabled = false; el.textContent = 'Borrar todo lo mío en Comunidad'; toast(cErr(e)); });
};

/* ---------- publicar un entreno (desde el fin del entreno o desde el entreno en Progreso) ---------- */
function pubDe(U) {
  var R = U.recs || [], r = R[0], rec = r ? r.e + ' ' + (r.p ? fN(r.p) + ' kg × ' : '') + r.r + (R.length > 1 ? ' (y ' + (R.length - 1) + (R.length === 2 ? ' más)' : ' más)') : '') : '';
  var ej = (U.ej || []).filter(function (e) { return e.tipo !== 'run' && e.tipo !== 'cardio' && (e.sets || []).length; }).slice(0, 30).map(function (e) { var s0 = e.sets[0] || {}; return { n: String(e.n).slice(0, 80), u: e.u || '', s: e.sets.length, r: String(s0.reps || '10').slice(0, 10) }; });
  return { t: String(U.nombre || 'Entreno').slice(0, 60), min: U.min || 0, nser: U.nser || 0, vol: U.vol || 0, rec: rec.slice(0, 80), rut: { ej: ej } };
}
A.finComu = function () {
  var C = CMU(), U = S.fin; if (!U) return;
  if (U.pub) return toast('Este entreno ya está en la Comunidad');
  if (C.est === undefined) return rpc('yo_comu_estado').then(function (e) { C.est = e || null; A.finComu(); }, function (e) { toast(cErr(e)); });
  if (C.est && C.est.activo && C.est.suspendido) return toast('Tu cuenta de Comunidad está suspendida');
  if (!comuActiva()) return hoja('<h2>Publicar en la Comunidad</h2><p class="mut">Para publicar tus entrenos, primero entra en la Comunidad: eliges el nombre que verán los demás y aceptas las normas.</p><button class="btn" data-a="cIrActivar">' + (C.est ? 'Volver a la Comunidad' : 'Activar Comunidad') + '</button><button class="btn sec" data-a="cerrarHoja">Ahora no</button>');
  var d = S.x.cpub = pubDe(U), n = d.rut.ej.length;
  var x = { id: 0, pid: C.est.pid, nombre: C.est.nombre, creado: new Date().toISOString(), t: d.t, min: d.min, nser: d.nser, vol: d.vol, rec: d.rec, nej: n, likes: 0, coms: 0, mio: true };
  hoja('<h2>Publicar en la Comunidad</h2><p class="mut sm">Así lo verá la gente de la Comunidad:</p>' + cardPub(x, true) +
    '<label class="f">Título<input id="cp-t" maxlength="60" value="' + esc(d.t) + '" data-in="cpTit"></label>' +
    (n ? '<label class="chk"><input type="checkbox" id="cp-rut" checked data-ch="cpRut"><span>Dejar que copien la rutina (' + n + (n === 1 ? ' ejercicio' : ' ejercicios') + ', con sus series y repeticiones, sin tus pesos)</span></label>' : '') +
    '<p class="cm-nunca">' + ic('escudo', 15) + '<span>No sale tu peso, ni tus fotos, ni lo que comes.</span></p>' +
    '<button class="btn" data-a="cPublicar">Publicar</button><button class="btn sec" data-a="cerrarHoja">Cancelar</button>');
};
IN.cpTit = function (t) { var b = document.querySelector('.cm-pub.prev .cm-t'); if (b) b.textContent = t.value.trim() || ' '; };
CH.cpRut = function (t) { var s = document.querySelector('.cm-pub.prev .cm-cop'); if (s) s.textContent = t.checked ? 'Se podrá copiar la rutina' : 'Sin rutina para copiar'; };
A.cPublicar = function (el) {
  var U = S.fin, d = S.x.cpub, C = CMU(); if (!U || !d || el.disabled) return;
  var t = String(($('#cp-t') || {}).value || '').trim(); if (!t) return toast('Ponle un título');
  d.t = t.slice(0, 60); if (!$('#cp-rut') || !$('#cp-rut').checked) delete d.rut;
  el.disabled = true; el.textContent = 'Publicando…';
  rpc('yo_comu_publicar', { sid: U.id, d: d }).then(function (r) {
    cerrarHoja(); U.pub = (r && r.id) || 1; olvidaFeeds(); if (C.est) C.est.pubs = (C.est.pubs || 0) + 1; C.pers = {};
    toast('Publicado en la Comunidad', 'ok'); pintar();
  }, function (e) {
    var m = cErr(e); if (/ya está publicado/.test(m)) { cerrarHoja(); U.pub = 1; pintar(); return toast('Este entreno ya estaba en la Comunidad'); }
    el.disabled = false; el.textContent = 'Publicar'; toast(m);
  });
};

arrancar();
</script>
