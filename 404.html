*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#111;background:#E9E9EC;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit}
.pg{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-size:16px;font-weight:800;border:0;cursor:pointer;width:100%;background:var(--acc);color:var(--acc-t);transition:transform .15s}
.btn:active{transform:scale(.98)}.btn.out{background:transparent;border:1.5px solid currentColor;color:inherit;font-weight:700;height:50px}
.btn.bl{background:#fff;color:#111}
/* portada oscura */
.hero{position:relative;color:#fff;background:#0B0B0C;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 26px}
.hero .ft{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 20% 10%,#4A4A4F 0,#1A1A1C 55%,#0B0B0C 100%)}
.hero .ft img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ft:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,.08) 45%,rgba(0,0,0,.92) 100%)}
.top{position:absolute;top:calc(16px + env(safe-area-inset-top));left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.marca{display:flex;flex-direction:column;line-height:1;min-width:0}.marca b{font-size:17px;font-weight:800;letter-spacing:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca span{font-size:9px;font-weight:700;letter-spacing:2.2px;opacity:.75;margin-top:4px;text-transform:uppercase}
.logo{display:inline-flex;align-items:center;max-width:62%}.logo img{display:block;max-height:46px;max-width:100%;object-fit:contain}.hero .logo{background:rgba(255,255,255,.94);border-radius:14px;padding:6px 10px}
.esc{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid rgba(255,255,255,.45);font-size:12px;font-weight:700;white-space:nowrap}
.hc{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:14px;background:rgba(255,255,255,.16);font-size:12px;font-weight:700}.pill i{width:7px;height:7px;border-radius:4px;background:#34C77B}
.eye{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#D8D8DE}
h1{margin:0;font-size:38px;line-height:1.04;font-weight:800;letter-spacing:-1.2px}
.hc p{margin:0;font-size:15px;line-height:1.5;color:#E6E6EB}
/* portada clara */
.t-claro .hero{background:#fff;color:#111;min-height:0;padding:calc(64px + env(safe-area-inset-top)) 20px 8px;justify-content:flex-start}
.t-claro .top{color:#111}.t-claro .esc{border-color:#DADAE0}.t-claro .pill{background:#F2F2F5}.t-claro .pill i{background:#13915A}.t-claro .eye{color:#6A6A70}
.t-claro h1{font-size:36px}.t-claro .hc p{color:#4A4A50}
.t-claro .hero .ft{position:relative;inset:auto;order:9;height:340px;border-radius:26px;overflow:hidden;margin-top:6px;background:linear-gradient(135deg,#ECECEF,#D9D9DE)}
.t-claro .hero .ft:after{display:none}.t-claro .hc{order:1}
.chip-v{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:16px;background:rgba(255,255,255,.95);font-size:12px;font-weight:700;color:#111}
/* cifras */
.cif{display:flex;align-items:stretch;padding:18px 12px;border-bottom:1px solid #ECECF0}.cif>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:2px 4px}
.cif>div+div{border-left:1px solid #E2E2E8}.cif b{font-size:24px;font-weight:800;letter-spacing:-.6px}.cif span{font-size:11.5px;line-height:1.3;color:#4A4A50}
/* secciones */
.cu{display:flex;flex-direction:column;gap:40px;padding:34px 20px 40px}
.sec{display:flex;flex-direction:column;gap:16px}h2{margin:0;font-size:26px;line-height:1.12;font-weight:800;letter-spacing:-.6px}.sub{margin:-8px 0 0;font-size:15px;line-height:1.5;color:#4A4A50}
.eyb{font-size:11px;font-weight:800;letter-spacing:1.4px;color:#6A6A70;text-transform:uppercase}
.chk{display:flex;gap:12px;align-items:flex-start}.chk i{width:26px;height:26px;border-radius:13px;background:var(--acc);color:var(--acc-t);display:flex;align-items:center;justify-content:center;flex:none}.chk i .ic{width:15px;height:15px;stroke-width:2.6}.chk span{font-size:15px;line-height:1.45;padding-top:2px}
.cita{margin:0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.4px}.txt{margin:0;font-size:15px;line-height:1.6;color:#3A3A3C;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{height:30px;padding:0 12px;border-radius:15px;background:#F2F2F5;font-size:12px;font-weight:700;display:flex;align-items:center}
.paso{display:flex;gap:14px}.paso .n{display:flex;flex-direction:column;align-items:center;flex:none}.paso .n b{width:34px;height:34px;border-radius:17px;background:var(--acc);color:var(--acc-t);font-size:14px;display:flex;align-items:center;justify-content:center}
.paso .n i{flex:1;width:2px;background:#DADAE0;margin:4px 0}.paso>div:last-child{display:flex;flex-direction:column;gap:3px;padding-bottom:22px}.paso:last-child>div:last-child{padding-bottom:0}
.paso .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.paso .t b{font-size:17px;font-weight:800}.paso .t small{font-size:12px;font-weight:700;color:#6A6A70}.paso p{margin:0;font-size:14px;line-height:1.5;color:#3A3A3C}
.app{background:#F2F2F5;margin:0 -20px;padding:34px 20px}.tira{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;margin:0 -20px;padding:4px 20px;scrollbar-width:none}.tira::-webkit-scrollbar{display:none}
.tel{flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;width:150px}.tel.an{width:200px}.tel .im{height:310px;display:flex;align-items:flex-end;justify-content:center}.tel img{width:100%;height:auto;display:block}
.tel b{font-size:14px}.tel small{font-size:12px;line-height:1.4;color:#4A4A50}
.ven{display:flex;flex-direction:column;gap:10px}.ven div{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.4}.ven i{width:22px;height:22px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.ven i .ic{width:13px;height:13px;stroke-width:2.6}
.opis{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}.opis::-webkit-scrollbar{display:none}
.opi{flex:0 0 272px;scroll-snap-align:start;background:#fff;border:1px solid #E2E2E8;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}.opi.solo{flex-basis:100%}
.opi b.c{font-size:28px;font-weight:800;letter-spacing:-.8px}.opi small{font-size:12px;color:#4A4A50}.opi p{margin:0;font-size:14px;line-height:1.5}.opi .q{font-size:13px;font-weight:700}
.plan{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px;border-radius:22px;cursor:pointer;background:#fff;color:#111;border:1px solid #DADAE0;width:100%}
.plan.on{background:var(--acc);color:var(--acc-t);border:2px solid var(--acc)}.plan .h{display:flex;justify-content:space-between;align-items:center;gap:8px}.plan .h b{font-size:18px;font-weight:800}
.plan .tg{font-size:11px;font-weight:800;height:24px;padding:0 10px;border-radius:12px;display:flex;align-items:center;background:#F2F2F5;color:#4A4A50;white-space:nowrap}.plan.on .tg{background:rgba(255,255,255,.92);color:#111}
.plan .pr{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}.plan .pr b{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1}.plan .pr span{font-size:15px;font-weight:700;opacity:.75}.plan .pr2{display:block;font-size:13px;font-weight:600;opacity:.75;margin-top:-6px}

      h=(X.hero||'')+(X.cifras||'')+'<div class="cu">'+['para','sobre','pasos','app','opi','planes','faq'].map(function(k){ return X[k]||''; }).join('')+'</div>'+X.fin+
        '<div class="barra" id="barra">'+(P.nombre?'<span class="bn"><b>'+esc(P.nombre)+'</b>'+(P.lema?'<small>'+esc(P.lema)+'</small>':'')+'</span>':'')+'<button class="btn" data-empezar="'+(P.cuest?'barra':'wa')+'">'+(P.cuest?'Quiero empezar':'Escríbeme')+'</button>'+(P.wa&&P.cuest?'<a class="wa" href="'+esc(waUrl(''))+'" data-ev="wa" target="_blank" rel="noopener" aria-label="WhatsApp">'+ic('wa')+'</a>':'')+'</div>';
    }
    pg.className='pg t-'+(claro?'claro':'oscuro'); pg.innerHTML=h;
    document.querySelector('meta[name=theme-color]').setAttribute('content',claro?'#FFFFFF':'#0B0B0C');
    if(ED) decorar(claro);
    if(SOLO||ALTO) alto();
  }
  /* v53.4.167 · modo editar: un botón «✎» en cada parte y, donde falta algo, un hueco «+ Añade…» en su sitio. Al tocar, el panel abre esa parte. */
  var EDN={portada:['Portada'],cifras:['Cifras','Tres datos que den confianza'],para:['Para ti','Las frases en las que se reconocen'],sobre:['Sobre mí','Quién eres y cómo trabajas'],pasos:['Así trabajamos','Del cuestionario al seguimiento'],
    app:['Tu app','Las capturas de la app'],opi:['Opiniones','Lo que dicen tus clientes'],planes:['Planes','Tus planes y precios'],faq:['Preguntas','Las dudas de siempre'],empezar:['Cuando quieren empezar']};
  var EDI={portada:'v-hero',cifras:'v-cifras',para:'v-para',sobre:'v-sobre',pasos:'v-pasos',app:'v-app',opi:'v-opi',planes:'planes',faq:'v-faq',empezar:'empezar'};
  function decorar(claro){
    var S=P.sec||{}, cu=pg.querySelector('.cu'), orden=['para','sobre','pasos','app','opi','planes','faq'];
    var hueco=function(k){ var off=S[k]===false, b=document.createElement('button'); b.type='button'; b.className='ed-hueco'+(off?' off':''); b.dataset.edk=k;
      b.innerHTML='<span>'+ic('mas')+'</span><b>'+(off?esc(EDN[k][0])+': apagado':'Añade «'+esc(EDN[k][0])+'»')+'</b><small>'+(off?'Tócalo para encenderlo o cambiarlo':esc(EDN[k][1]||''))+'</small>'; return b; };
    Object.keys(EDI).forEach(function(k){ var el=document.getElementById(EDI[k]); if(!el) return; el.dataset.edk=k; el.classList.add('ed-z');
      var c=document.createElement('button'); c.type='button'; c.className='ed-ch'; c.dataset.edk=k; c.innerHTML='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/></svg>'+esc(EDN[k][0]); el.appendChild(c); });
    if(!document.getElementById('v-cifras')){ var hc=hueco('cifras'); if(claro){ var cv=pg.querySelector('.chip-v'); if(cv&&(P.cifras||[]).length){ cv.dataset.edk='cifras'; hc=null; } } if(hc){ hc.classList.add('ed-cif'); var he=document.getElementById('v-hero'); if(he&&he.nextSibling) pg.insertBefore(hc,he.nextSibling); } }
    if(cu) orden.forEach(function(k,i){ if(document.getElementById(EDI[k])) return; var sig=null; for(var j=i+1;j<orden.length&&!sig;j++) sig=document.getElementById(EDI[orden[j]]); var b=hueco(k); if(sig&&sig.parentNode===cu) cu.insertBefore(b,sig); else cu.appendChild(b); });
    marcar();
  }
  function marcar(){ [].forEach.call(document.querySelectorAll('.ed-sel'),function(e){ e.classList.remove('ed-sel'); }); if(!SEL) return; var k=SEL==='marca'?'portada':SEL, e=document.querySelector('.ed-z[data-edk="'+k+'"],.ed-hueco[data-edk="'+k+'"]'); if(e) e.classList.add('ed-sel'); }
  function empezar(planIdx){
    var p=planIdx!=null?(P.planes||[])[planIdx]:null, e=document.getElementById('err');
    if(!P.cuest){ ev('wa'); location.href=waUrl(p?p.nombre:''); return; }
    var bs=document.querySelectorAll('[data-empezar]'); bs.forEach(function(b){ b.disabled=true; }); if(e) e.textContent='';
    fetch(API+'/pagina/cuest',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({s:slug,plan:p?p.id:''})}).then(function(r){ return r.json(); }).then(function(j){
      if(j&&j.ok&&j.url){ ev('cu'); location.href=j.url; return; }
      bs.forEach(function(b){ b.disabled=false; }); if(e) e.textContent=(j&&j.error)||'No se ha podido abrir el cuestionario. Prueba otra vez.';
    },function(){ bs.forEach(function(b){ b.disabled=false; }); if(e) e.textContent='Sin conexión. Prueba otra vez.'; });
  }
  function aviso(t){ var a=document.getElementById('vt'); if(!a){ a=document.createElement('div'); a.id='vt'; a.className='vt'; document.body.appendChild(a); } a.textContent=t; a.classList.add('ver'); clearTimeout(aviso.t); aviso.t=setTimeout(function(){ a.classList.remove('ver'); },1800); }
  document.addEventListener('click',function(e){
    if(ED){ var z=e.target.closest('[data-edk]'); if(z){ e.preventDefault(); e.stopPropagation(); try{ parent.postMessage({tipo:'mo-vista-editar',k:z.dataset.edk},location.origin); }catch(er){} return; } }
    if(VISTA){ var z=e.target.closest('[data-empezar],[data-ev],a[target]'); if(z){ e.preventDefault(); aviso('En la vista previa los botones no hacen nada'); return; } }
    var t=e.target.closest('[data-plan],[data-faq],[data-empezar],[data-ir],[data-ev]'); if(!t) return;
    if(t.dataset.ev){ ev(t.dataset.ev); return; }
    if(t.dataset.ir){ e.preventDefault(); var d=document.getElementById(t.dataset.ir); if(d) d.scrollIntoView({behavior:'smooth'}); return; }
    if(t.dataset.plan!=null){ sel=+t.dataset.plan; var y=window.scrollY; pintar(); window.scrollTo(0,y); verBarra(); return; }
    if(t.dataset.faq!=null){ var a=document.getElementById('fa'+t.dataset.faq), ab=t.getAttribute('aria-expanded')==='true'; t.setAttribute('aria-expanded',!ab); if(a) a.hidden=ab; return; }
    var k=t.dataset.empezar;
    if(k==='plan') return empezar(sel);
    if(k==='wa'){ ev('wa'); location.href=waUrl(''); return; }
    if(k==='barra'){ var d2=document.getElementById('empezar'); if(d2) d2.scrollIntoView({behavior:'smooth'}); return; }
    empezar(null);
  });
  function verBarra(){ var b=document.getElementById('barra'), f=document.getElementById('empezar'); if(!b||!f) return; var r=f.getBoundingClientRect(); b.classList.toggle('ver',window.scrollY>520&&r.top>window.innerHeight*0.6); }
  addEventListener('scroll',verBarra,{passive:true}); addEventListener('resize',verBarra);
  /* vista previa: los datos (sin guardar) llegan del panel, que está en la misma dirección; no cuenta visitas ni abre nada */
  function alto(){ try{ parent.postMessage({tipo:'mo-vista-alto',solo:SOLO,h:Math.ceil(pg.getBoundingClientRect().height)},location.origin); }catch(er){} }
  function irY(k){ var e=document.querySelector('.ed-z[data-edk="'+k+'"],.ed-hueco[data-edk="'+k+'"]'); try{ parent.postMessage({tipo:'mo-vista-y',y:e?Math.max(0,Math.round(e.getBoundingClientRect().top+window.scrollY)):0},location.origin); }catch(er){} }
  function ir(k){ var id={marca:'v-hero',diseno:'v-hero',portada:'v-hero',cifras:'v-cifras',para:'v-para',sobre:'v-sobre',pasos:'v-pasos',app:'v-app',opi:'v-opi',planes:'planes',faq:'v-faq',empezar:'empezar'}[k], d=id&&document.getElementById(id);
    if(!d) return; window.scrollTo({top:Math.max(0,d.getBoundingClientRect().top+window.scrollY-(k==='cifras'?60:8)),behavior:'smooth'}); d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash'); }
  if(VISTA){
    if(SOLO) document.documentElement.classList.add('v-solo');
    if(ED) document.documentElement.classList.add('v-ed'); if(ALTO) document.documentElement.classList.add('v-alto');
    addEventListener('message',function(e){
      if(e.source!==window.parent||e.origin!==location.origin||!e.data||e.data.tipo!=='mo-vista') return;
      if(e.data.p){ var y=window.scrollY, ant=P; P=e.data.p; if(!P._img&&ant&&ant._img) P._img=ant._img; if(!ant||ant.destacado!==P.destacado||(ant.planes||[]).length!==(P.planes||[]).length) sel=-1; pintar(); window.scrollTo(0,y); verBarra(); }
      if(e.data.sel!=null){ SEL=String(e.data.sel||''); marcar(); }
      if(e.data.ir&&P) setTimeout(function(){ var k=e.data.ir==='marca'?'portada':e.data.ir; if(ALTO) irY(k); else if(ED){ var d=document.querySelector('.ed-z[data-edk="'+k+'"],.ed-hueco[data-edk="'+k+'"]'); if(d) window.scrollTo({top:Math.max(0,d.getBoundingClientRect().top+window.scrollY-10),behavior:'smooth'}); } else ir(e.data.ir); },60);
    });
    addEventListener('load',function(){ if(SOLO||ALTO) alto(); });
    if((SOLO||ALTO)&&window.ResizeObserver) new ResizeObserver(function(){ alto(); }).observe(pg);
    if(!SOLO){      // en el ordenador, el móvil de ejemplo también se desliza arrastrando con el ratón (como con el dedo)
      var dg=null, html=document.documentElement; html.classList.add('v-drag');
      addEventListener('dragstart',function(e){ e.preventDefault(); },true);
      addEventListener('pointerdown',function(e){ if(e.pointerType!=='mouse'||e.button!==0) return; dg={y:e.clientY,sy:window.scrollY,mov:false}; },true);
      addEventListener('pointermove',function(e){ if(!dg) return; if(!e.buttons){ dg=null; html.classList.remove('arrastra'); return; }
        var dy=e.clientY-dg.y; if(!dg.mov&&Math.abs(dy)>5){ dg.mov=true; html.classList.add('arrastra'); } if(dg.mov){ window.scrollTo(0,dg.sy-dy); e.preventDefault(); } },true);
      addEventListener('pointerup',function(){ if(dg&&dg.mov){ var f=function(ev){ ev.stopPropagation(); ev.preventDefault(); }; addEventListener('click',f,true); setTimeout(function(){ removeEventListener('click',f,true); },60); }
        dg=null; html.classList.remove('arrastra'); },true);
    }
    document.addEventListener('load',function(e){ if((SOLO||ALTO)&&e.target&&e.target.tagName==='IMG') alto(); },true);
    try{ parent.postMessage({tipo:'mo-vista-lista',solo:SOLO},location.origin); }catch(er){}
    return;
  }
  fetch(API+'/pagina?s='+encodeURIComponent(slug)).then(function(r){ return r.json(); }).then(function(j){
    if(!j||!j.ok||!j.p) return nada();
    P=j.p; pintar(); verBarra();
    ev('v');      // una visita (sin cookies ni nada guardado en su móvil)
  },function(){ pg.innerHTML='<div class="nada"><h1>Sin conexión</h1><p>No se ha podido cargar la página. Prueba otra vez en un momento.</p></div>'; });
})();
</script>
