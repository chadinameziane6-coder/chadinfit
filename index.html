<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MOOD ON by Chadin</title>
<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOOD ON">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='3'%3E%3Cpath d='M9 44V20l9 12 9-12v24'/%3E%3Cpath d='M45 20a12 12 0 1 1-12 12'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="ati" href="">
<style>
html:not(.grab),html:not(.grab) body{margin:0;height:100%;background:#F5F5F7;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#F5F5F7}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F5F5F7;transition:opacity .35s;z-index:2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#splash svg{display:block;max-width:62vw;height:auto}
#splash small{font-size:10.5px;letter-spacing:.55em;color:#6E6E73;text-transform:uppercase;padding-left:.55em;font-weight:300;margin-top:6px}
#splash i{display:block;width:110px;height:3px;background:#E5E5EA;border-radius:3px;overflow:hidden;position:relative;margin-top:12px}
#splash i:after{content:"";position:absolute;inset:0;width:40%;background:#111;border-radius:3px;animation:c 1.1s ease-in-out infinite}
@keyframes c{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#splash.fuera{opacity:0;pointer-events:none}
#avisos{position:fixed;left:12px;bottom:12px;z-index:3;display:none;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px 6px 6px 14px;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#avisos button{border:0;background:#fff;color:#111;border-radius:999px;padding:7px 12px;font:inherit;cursor:pointer}
#avisos .x{background:none;color:#fff;padding:7px 9px}
/* v31: compartir el entreno desde aquí (fuera del marco de Google sí se puede compartir, guardar y copiar) */
#sh{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#sh .sh-b{position:absolute;inset:0;background:rgba(0,0,0,.72)}
#sh .sh-c{position:relative;width:100%;max-width:460px;background:#fff;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box;max-height:100%;overflow:auto}
#sh .sh-img{display:flex;justify-content:center;border-radius:18px;overflow:hidden;background:#111}
#sh .sh-img.tr{background:repeating-conic-gradient(#d9d9de 0 25%,#f2f2f5 0 50%) 0 0/24px 24px}
#sh .sh-img img{display:block;max-height:58vh;max-width:100%;-webkit-touch-callout:default}
#sh .sh-acc{display:grid;gap:8px;margin-top:12px}
#sh .sh-acc button,#sh .sh-acc a{display:block;text-align:center;border:0;border-radius:999px;padding:14px;font:600 16px inherit;background:#111;color:#fff;text-decoration:none;cursor:pointer}
#sh .sh-acc .sec{background:#F2F2F5;color:#111}
#sh p{margin:10px 4px 0;font-size:13px;line-height:1.45;color:#6E6E73;text-align:center}
</style>
<style id="grab-css" media="not all">
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F5F5F7;color:#141414;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.c{background:#fff;border-radius:22px;padding:26px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.b{font:300 16px sans-serif;letter-spacing:.42em;color:#111;padding-left:.42em}
h1{font-size:21px;margin:10px 0 4px}
p{color:#5C5C60;font-size:15px;line-height:1.45;margin:8px 0}
.mic{width:116px;height:116px;border-radius:50%;border:0;background:#141414;color:#fff;font-size:17px;font-weight:700;margin:18px auto 8px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 22px rgba(20,20,20,.35)}
.mic.rec{background:#C4001F;animation:l 1.2s infinite}
@keyframes l{0%{box-shadow:0 0 0 0 rgba(196,0,31,.45)}70%{box-shadow:0 0 0 22px rgba(196,0,31,0)}100%{box-shadow:0 0 0 0 rgba(196,0,31,0)}}
.t{font:700 30px ui-monospace,monospace;margin:4px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer;background:#141414;color:#fff}
.btn:disabled{opacity:.6}
.sec{background:#EDEDF0;color:#141414}
audio{width:100%;margin-top:12px}
.ok{color:#0E7A43;font-weight:700}.err{color:#B00020}.h{display:none}
small{display:block;color:#87878B;margin-top:14px;font-size:12.5px}
</style>
</head>
<body>
<div id="splash"><svg viewBox="-6 -6 783 112" width="230" aria-label="MOOD ON"><g fill="none" stroke="#111" stroke-width="6" stroke-linejoin="round"><path d="M2.5 100V2.5L56 62L109.5 2.5V100"/><path d="M192.5 2.5A47.5 47.5 0 1 1 145 50"/><path d="M316.7 2.5A47.5 47.5 0 1 1 269.2 50"/><path d="M394 2.5H431.5A47.5 47.5 0 0 1 431.5 97.5H394"/><path d="M596.7 2.5A47.5 47.5 0 1 1 549.2 50"/><path d="M676.7 100V2.5L766 97.5V0"/></g></svg><small>by Chadin</small><i></i></div>
<iframe id="app" title="MOOD ON by Chadin" allow="clipboard-write; autoplay; fullscreen; web-share"></iframe>
<div id="avisos"><span>Avisos de mensajes nuevos</span><button id="av-si">Activar</button><button class="x" id="av-no" aria-label="Ahora no">✕</button></div>
<template id="grab"><div class="c">
  <div class="b">MOOD ON</div>
  <h1 id="tit">Nota de voz</h1>
  <p id="m">Pulsa Grabar y habla. La primera vez, el móvil te pedirá permiso para usar el micrófono: dale a Permitir.</p>
  <div id="gb"><button class="mic" id="mic" type="button">Grabar</button><div class="t" id="t">0:00</div></div>
  <div id="rv" class="h"><audio id="a" controls></audio><button class="btn" id="env" type="button">Enviar</button><button class="btn sec" id="rep" type="button">Repetir</button></div>
  <div id="fin" class="h"><button class="btn sec" type="button" onclick="window.close()">Cerrar esta ventana</button></div>
  <button class="btn sec" id="can" type="button" style="margin-top:18px" onclick="window.close()">Cancelar</button>
  <small>Grabadora de notas de voz de MOOD ON by Chadin. Solo se envía a tu chat cuando pulsas Enviar.</small>
</div></template>
<script>
/* MOOD ON by Chadin · página de inicio.
   1) Abre tu app de Google (la dirección /exec de abajo) a pantalla completa, sin el aviso
      "Esta aplicación la ha creado un usuario de Google Apps Script", con su icono y su nombre.
   2) Es también la grabadora de notas de voz del chat: la app la abre con #u=…&t=… (pase temporal). */
var APP = 'https://script.google.com/macros/s/AKfycbzEdBDEqqIGkL_Lgr-om1JC_VdeVTqPR1ZYUb35Tzp2Hbb1_dJ8F9mFBsi7aKikGfSNig/exec';

if (/(^|[#&])t=/.test(location.hash)) {
  /* grabadora de notas de voz */
  document.documentElement.className = 'grab';
  document.title = 'Nota de voz · MOOD ON';
  document.getElementById('grab-css').media = 'all';
  document.body.innerHTML = document.getElementById('grab').innerHTML;
  (function(){
  // Datos que pone la app en la dirección: u = dirección de la app, t = pase de un solo chat (caduca), p = para quién es
  var q={}; String(location.hash||'').replace(/^#/,'').split('&').forEach(function(x){ var i=x.indexOf('='); if(i>0) q[x.slice(0,i)]=decodeURIComponent(x.slice(i+1)); });
  if(q.t) try{ history.replaceState(null,'',location.pathname); }catch(e){}
  var U=q.u||'', T=q.t||'', P=q.p||'tu coach';
  var okU=/^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/exec$/.test(U)||/^http:\/\/localhost:\d+\/exec$/.test(U);
  function $(i){ return document.getElementById(i); }
  function ver(i,v){ $(i).classList.toggle('h',!v); }
  function msg(t,c){ var m=$('m'); m.textContent=t; m.className=c||''; }
  function mmss(s){ return Math.floor(s/60)+':'+('0'+s%60).slice(-2); }
  $('tit').textContent='Nota de voz para '+P;
  if(!okU||!/^g[a-f0-9]{20}$/.test(T)){ msg('Abre esta página desde el chat de la app, tocando el micrófono.','err'); ver('gb',0); return; }
  var st=null,rec=null,tr=[],t0=0,tI=null,blob=null,dur=0,k='m'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  function iosEs(){ return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); }
  function grabar(){
    if(rec){ parar(); return; }
    if(!navigator.mediaDevices||!window.MediaRecorder){ msg('Este navegador no deja grabar audio. Abre la app en Safari (iPhone) o en Chrome (Android), o graba la nota con la grabadora del móvil y adjúntala en el chat con el +.','err'); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      st=s; var ty=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].filter(function(t){ return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t); })[0];
      rec=new MediaRecorder(s,ty?{mimeType:ty}:undefined); tr=[];
      rec.ondataavailable=function(e){ if(e.data&&e.data.size) tr.push(e.data); };
      rec.onstop=function(){ st.getTracks().forEach(function(x){ x.stop(); }); blob=new Blob(tr,{type:rec.mimeType||ty||'audio/webm'}); rec=null; $('a').src=URL.createObjectURL(blob); ver('rv',1); ver('gb',0); $('mic').classList.remove('rec'); $('mic').textContent='Grabar'; msg('Escúchala si quieres y pulsa Enviar.'); };
      rec.start(); t0=Date.now(); $('mic').classList.add('rec'); $('mic').textContent='Parar'; msg('Grabando… pulsa Parar cuando termines (máximo 3 minutos).');
      tI=setInterval(function(){ dur=Math.round((Date.now()-t0)/1000); $('t').textContent=mmss(dur); if(dur>=180) parar(); },300);
    },function(e){
      var n=(e&&e.name)||'';
      msg(n==='NotFoundError'?'No se encuentra ningún micrófono en este dispositivo.':
        (iosEs()?'El iPhone no ha dado permiso al micrófono. Toca «aA» junto a la dirección → Ajustes del sitio web → Micrófono → Permitir. Si no aparece, en Ajustes del iPhone → Safari → Micrófono → Preguntar. Después vuelve a pulsar Grabar.':
        'El navegador no ha dado permiso al micrófono. Toca el candado o el icono junto a la dirección → Permisos → Micrófono → Permitir, y vuelve a pulsar Grabar.')+(n?' ('+n+')':''),'err');
    });
  }
  function parar(){ clearInterval(tI); if(rec&&rec.state!=='inactive') rec.stop(); }
  function repetir(){ blob=null; ver('rv',0); ver('gb',1); $('t').textContent='0:00'; msg('Pulsa Grabar y habla.'); }
  function enviar(){
    if(!blob) return; $('env').disabled=true; msg('Enviando…');
    var fr=new FileReader();
    fr.onload=function(){
      var d=String(fr.result).replace(/^data:([^;,]+)[^,]*,/,'data:$1;base64,');
      fetch(U,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acc:'audio',pase:T,k:k,datos:d,dur:dur})})
        .then(function(){ comprobar(0); },function(){ comprobar(0); });
    };
    fr.readAsDataURL(blob);
  }
  function comprobar(n){
    var cb='ok'+Date.now(), sc=document.createElement('script'), hecho=false;
    window[cb]=function(r){ hecho=true; if(r&&r.ok){ msg('¡Enviada! Ya puedes cerrar esta ventana y volver a la app.','ok'); ver('rv',0); ver('fin',1); ver('can',0); setTimeout(function(){ try{ window.close(); }catch(e){} },1500); } else otra(n); };
    sc.onerror=function(){ if(!hecho) otra(n); };
    sc.src=U+'?chatok='+k+'&cb='+cb; document.body.appendChild(sc);
  }
  function otra(n){ if(n<4) setTimeout(function(){ comprobar(n+1); },1500); else { $('env').disabled=false; msg('No se ha podido enviar. Comprueba la conexión y vuelve a pulsar Enviar. Si ha pasado mucho rato, vuelve a la app y toca otra vez el micrófono.','err'); } }
  $('mic').onclick=grabar; $('rep').onclick=repetir; $('env').onclick=enviar;
})();
} else (function () {
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  var q = location.search || '';
  f.src = APP + q;
  function listo() { sp.className = 'fuera'; }
  setTimeout(listo, 9000);
  f.addEventListener('load', function () { setTimeout(listo, 2500); });

  /* icono para la pantalla de inicio del móvil */
  try {
    var cv = document.createElement('canvas'); cv.width = cv.height = 180; var x = cv.getContext('2d');
    x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 180, 180);
    x.save(); x.translate(18, 74); x.scale(144 / 771, 144 / 771);
    x.strokeStyle = '#111111'; x.lineWidth = 9; x.lineJoin = 'round';
    ['M2.5 100V2.5L56 62L109.5 2.5V100', 'M192.5 2.5A47.5 47.5 0 1 1 145 50', 'M316.7 2.5A47.5 47.5 0 1 1 269.2 50', 'M394 2.5H431.5A47.5 47.5 0 0 1 431.5 97.5H394',
     'M596.7 2.5A47.5 47.5 0 1 1 549.2 50', 'M676.7 100V2.5L766 97.5V0'].forEach(function (d) { x.stroke(new Path2D(d)); });
    x.restore();
    x.fillStyle = '#6E6E73'; x.textAlign = 'center'; x.font = '300 9px -apple-system,"Helvetica Neue",Arial,sans-serif';
    x.fillText('B Y   C H A D I N', 90, 118);
    document.getElementById('ati').href = cv.toDataURL('image/png');
  } catch (e) {}

  /* mensajes de la app: está lista, mensajes sin leer (número en la pestaña) y avisos */
  var SES = { cl: 'mo_ses_cl', co: 'mo_ses_co', dcl: 'mo_disp_cl', dco: 'mo_disp_co' };
  function deAqui(e) { try { return !!e.source && e.source.top === window; } catch (er) { return false; } }
  var esCoach = /[?&]coach(=|&|$)/.test(q);
  window.addEventListener('message', function (e) {
    var o = String(e.origin || '');
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(o) && !/^http:\/\/localhost(:\d+)?$/.test(o)) return;
    var d = e.data; if (!d || !d.chadinfit) return;
    if (d.listo) listo();
    /* v28: la sesión se recuerda aquí (en el iPhone, lo que guarda el marco de Google se borra al cerrar Safari).
       Solo se la damos a la app que va dentro de esta página. */
    if ((d.pideSes || d.guarda) && deAqui(e)) {
      if (d.guarda && SES[d.guarda.k]) { try { if (d.guarda.v) localStorage.setItem(SES[d.guarda.k], JSON.stringify(d.guarda.v)); else localStorage.removeItem(SES[d.guarda.k]); } catch (er) {} }
      if (d.pideSes) { var r = {}; Object.keys(SES).forEach(function (k) { try { var v = localStorage.getItem(SES[k]); if (v) r[k] = JSON.parse(v); } catch (er) {} }); try { e.source.postMessage({ chadinfit: 1, sesiones: r, cap: ['compartir'] }, o); } catch (er) {} }
    }
    if (d.compartir && deAqui(e) && /^data:image\/png;base64,/.test(String(d.compartir.img || ''))) compartir(d.compartir);
    if (typeof d.noLeidos === 'number') {
      document.title = (d.noLeidos ? '(' + d.noLeidos + ') ' : '') + 'MOOD ON';
      try { if (navigator.setAppBadge) { if (d.noLeidos) navigator.setAppBadge(d.noLeidos); else navigator.clearAppBadge(); } } catch (er) {}
    }
    if (d.aviso && esCoach && 'Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
      try { var n = new Notification(d.aviso.titulo || 'MOOD ON', { body: d.aviso.texto || '', tag: 'chadinfit-msg', renotify: true }); n.onclick = function () { window.focus(); n.close(); }; } catch (er) {}
    }
  });

  /* v31: compartir el entreno (historias de Instagram, WhatsApp…), guardar la imagen o copiarla para pegarla encima de tu foto */
  function compartir(c) {
    var ov = document.getElementById('sh'); if (ov) ov.parentNode.removeChild(ov);
    ov = document.createElement('div'); ov.id = 'sh';
    ov.innerHTML = '<div class="sh-b"></div><div class="sh-c"><div class="sh-img' + (c.modo === 'trans' ? ' tr' : '') + '"><img alt="Tu entreno"></div>' +
      '<div class="sh-acc"><button id="sh-s">Compartir en historias</button><button id="sh-c" class="sec">Copiar para pegar en tu historia</button><a id="sh-d" class="sec" download>Guardar imagen</a><button id="sh-x" class="sec">Cerrar</button></div><p id="sh-t"></p></div>';
    document.body.appendChild(ov);
    var tip = function (t) { ov.querySelector('#sh-t').textContent = t; };
    var cerrar = function () { if (ov.parentNode) ov.parentNode.removeChild(ov); };
    ov.querySelector('.sh-b').onclick = cerrar; ov.querySelector('#sh-x').onclick = cerrar;
    fetch(c.img).then(function (r) { return r.blob(); }).then(function (b) {
      var u = URL.createObjectURL(b), f = null, nom = String(c.nombre || 'MOOD_ON.png').replace(/[^\w.\-]/g, '_');
      try { f = new File([b], nom, { type: 'image/png' }); } catch (er) {}
      ov.querySelector('img').src = u;
      var dl = ov.querySelector('#sh-d'); dl.href = u; dl.setAttribute('download', nom);
      var sb = ov.querySelector('#sh-s'), cb = ov.querySelector('#sh-c');
      var puede = false; try { puede = !!(f && navigator.canShare && navigator.canShare({ files: [f] })); } catch (er) {}
      if (!puede) sb.style.display = 'none';
      if (!(c.modo === 'trans' && navigator.clipboard && window.ClipboardItem)) cb.style.display = 'none';
      sb.onclick = function () { navigator.share({ files: [f], title: 'Mi entreno', text: '#MOODON' }).catch(function () {}); };
      cb.onclick = function () { navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]).then(function () { tip('Copiada. En Instagram: crea tu historia con tu foto del gimnasio, mantén pulsado y elige «Pegar».'); }, function () { tip('No se ha podido copiar: guárdala y añádela en tu historia.'); }); };
      tip(puede ? 'Elige Instagram → Historia (o WhatsApp). Si no te sale, guarda la imagen y súbela desde tus fotos.' : 'Mantén pulsada la imagen y elige «Guardar» o «Compartir», o toca «Guardar imagen».');
      if (c.acc === 'compartir' && puede) { try { if (navigator.userActivation && navigator.userActivation.isActive) sb.click(); } catch (er) {} }
    }).catch(function () { tip('No se ha podido preparar la imagen.'); });
  }

  /* la coach puede activar los avisos del navegador (mensajes nuevos con la pestaña en segundo plano) */
  var av = document.getElementById('avisos');
  var ya = false; try { ya = localStorage.getItem('chadin_avisos') === 'no'; } catch (e) {}
  if (esCoach && 'Notification' in window && Notification.permission === 'default' && !ya) {
    setTimeout(function () { av.style.display = 'flex'; }, 4000);
    document.getElementById('av-si').onclick = function () { av.style.display = 'none'; try { Notification.requestPermission(); } catch (e) {} };
    document.getElementById('av-no').onclick = function () { av.style.display = 'none'; try { localStorage.setItem('chadin_avisos', 'no'); } catch (e) {} };
  }
})();
</script>
</body>
</html>
