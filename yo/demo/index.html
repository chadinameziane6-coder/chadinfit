<style>
/* ---------- MOOD ON · «Entreno por mi cuenta» · estilo Cromo pulido (yo-0.6) ----------
   Colores en variables: claro por defecto; oscuro si se elige «Oscuro» o si el móvil está en oscuro y no se ha elegido «Claro». */
:root{--fondo:radial-gradient(680px 420px at 50% -12%,#FFFFFF,rgba(255,255,255,0) 70%),linear-gradient(180deg,#EFEFF1 0%,#E2E2E5 100%);--pie:#E2E2E5;--pie0:rgba(226,226,229,0);--marco:#D5D5DA;
--tx:#0D0D0F;--tx2:#55555E;--tx3:#7A7A82;
--card:#FFFFFF;--card-g:linear-gradient(180deg,#FFFFFF 0%,#F6F6F7 100%);--card-b:#FFFFFF;--sombra:0 12px 30px rgba(20,20,30,.09);--sombra-s:0 6px 18px rgba(20,20,30,.07);
--suave:#F0F0F2;--suave2:#E6E6E9;--gris:#C9C9CF;--borde:#E4E4E8;--borde2:#D2D2D8;--linea:rgba(14,14,16,.07);
--neg:#0D0D0F;--neg-t:#FFFFFF;--neg-m:#BDBDC4;--neg-s:rgba(255,255,255,.14);
--sec:#FFFFFF;--sec-b:rgba(14,14,16,.10);--seg:#DEDEE2;--seg-on:#FFFFFF;--chip:#FFFFFF;--chip-b:rgba(14,14,16,.10);--chip-t:#0D0D0F;--acc-s:#FFFFFF;--btn-sh:0 8px 20px rgba(13,13,15,.16);
--verde:#0F7A47;--verde-bg:#E7F4EC;--verde-tx:#0B5C35;--rojo:#C62828;--rojo-bg:#FDECEC;--rojo-tx:#8E1C1C;
--ambar:#E0A100;--ambar-bg:#FFF6E0;--ambar-b:#F3D9A0;--ambar-tx:#5C3B00;
--prog:linear-gradient(90deg,#9AE6FF,#7C8CFF);--prog-v:linear-gradient(180deg,#9AE6FF,#7C8CFF);--pista:#E6E6E9;
--g-l:#E6E6EA;--g-p:#B9B9C2;--g-m:#0D0D0F;--g-a:rgba(124,140,255,.16);
--tab:#FFFFFF;--tab-b:rgba(13,13,15,.06);--tab-sh:0 14px 34px rgba(20,20,30,.14);--tab-on:#0D0D0F;--tab-on-t:#FFFFFF;--tab-off:#66666E;
--hero:radial-gradient(260px 160px at 85% 0%,rgba(255,255,255,.18),rgba(255,255,255,0) 70%) padding-box,linear-gradient(160deg,#3A3A40 0%,#16161A 45%,#0A0A0B 100%) padding-box,linear-gradient(135deg,#FFFFFF 0%,#77777F 35%,#E8E8EC 60%,#55555C 100%) border-box;
--hero-sh:0 18px 40px rgba(10,10,12,.28);--hero-m:#BDBDC4;--flota-b:transparent;
color-scheme:light}
html[data-tema="oscuro"]{--fondo:radial-gradient(680px 420px at 50% -12%,rgba(255,255,255,.07),rgba(255,255,255,0) 70%),linear-gradient(180deg,#121214 0%,#0A0A0B 100%);--pie:#0A0A0B;--pie0:rgba(10,10,11,0);--marco:#050506;
--tx:#F2F2F4;--tx2:#A3A3AC;--tx3:#7E7E87;
--card:#1B1B1F;--card-g:linear-gradient(180deg,#1D1D21 0%,#17171A 100%);--card-b:rgba(255,255,255,.07);--sombra:0 12px 30px rgba(0,0,0,.35);--sombra-s:0 6px 18px rgba(0,0,0,.3);
--suave:#25252A;--suave2:#2B2B31;--gris:#3A3A41;--borde:rgba(255,255,255,.08);--borde2:rgba(255,255,255,.16);--linea:rgba(255,255,255,.07);
--neg:#F2F2F4;--neg-t:#0D0D0F;--neg-m:#55555E;--neg-s:rgba(0,0,0,.08);
--sec:#25252A;--sec-b:rgba(255,255,255,.08);--seg:#1C1C20;--seg-on:#2E2E34;--chip:#1C1C20;--chip-b:rgba(255,255,255,.08);--chip-t:#C9C9D0;--acc-s:rgba(255,255,255,.08);--btn-sh:0 8px 20px rgba(0,0,0,.4);
--verde:#2BB673;--verde-bg:rgba(43,182,115,.14);--verde-tx:#7FDDAF;--rojo:#FF6B6B;--rojo-bg:rgba(255,107,107,.12);--rojo-tx:#FFB3B3;
--ambar:#F2B33D;--ambar-bg:rgba(242,179,61,.12);--ambar-b:rgba(242,179,61,.35);--ambar-tx:#F5D08A;
--pista:rgba(255,255,255,.10);
--g-l:rgba(255,255,255,.08);--g-p:#5A5A62;--g-m:#F2F2F4;--g-a:rgba(124,140,255,.22);
--tab:#1C1C20;--tab-b:rgba(255,255,255,.08);--tab-sh:0 14px 34px rgba(0,0,0,.5);--tab-on:#F2F2F4;--tab-on-t:#0D0D0F;--tab-off:#8E8E96;
--hero:radial-gradient(260px 160px at 85% 0%,rgba(255,255,255,.12),rgba(255,255,255,0) 70%) padding-box,linear-gradient(160deg,#2E2E34 0%,#1B1B1F 50%,#121214 100%) padding-box,linear-gradient(135deg,#FFFFFF 0%,#6E6E76 35%,#DADADF 60%,#4A4A51 100%) border-box;
--hero-sh:0 18px 40px rgba(0,0,0,.5);--hero-m:#B9B9C1;--flota-b:rgba(255,255,255,.10);
color-scheme:dark}
@media (prefers-color-scheme:dark){html:not([data-tema="claro"]){--fondo:radial-gradient(680px 420px at 50% -12%,rgba(255,255,255,.07),rgba(255,255,255,0) 70%),linear-gradient(180deg,#121214 0%,#0A0A0B 100%);--pie:#0A0A0B;--pie0:rgba(10,10,11,0);--marco:#050506;
--tx:#F2F2F4;--tx2:#A3A3AC;--tx3:#7E7E87;
--card:#1B1B1F;--card-g:linear-gradient(180deg,#1D1D21 0%,#17171A 100%);--card-b:rgba(255,255,255,.07);--sombra:0 12px 30px rgba(0,0,0,.35);--sombra-s:0 6px 18px rgba(0,0,0,.3);
--suave:#25252A;--suave2:#2B2B31;--gris:#3A3A41;--borde:rgba(255,255,255,.08);--borde2:rgba(255,255,255,.16);--linea:rgba(255,255,255,.07);
--neg:#F2F2F4;--neg-t:#0D0D0F;--neg-m:#55555E;--neg-s:rgba(0,0,0,.08);
--sec:#25252A;--sec-b:rgba(255,255,255,.08);--seg:#1C1C20;--seg-on:#2E2E34;--chip:#1C1C20;--chip-b:rgba(255,255,255,.08);--chip-t:#C9C9D0;--acc-s:rgba(255,255,255,.08);--btn-sh:0 8px 20px rgba(0,0,0,.4);
--verde:#2BB673;--verde-bg:rgba(43,182,115,.14);--verde-tx:#7FDDAF;--rojo:#FF6B6B;--rojo-bg:rgba(255,107,107,.12);--rojo-tx:#FFB3B3;
--ambar:#F2B33D;--ambar-bg:rgba(242,179,61,.12);--ambar-b:rgba(242,179,61,.35);--ambar-tx:#F5D08A;
--pista:rgba(255,255,255,.10);
--g-l:rgba(255,255,255,.08);--g-p:#5A5A62;--g-m:#F2F2F4;--g-a:rgba(124,140,255,.22);
--tab:#1C1C20;--tab-b:rgba(255,255,255,.08);--tab-sh:0 14px 34px rgba(0,0,0,.5);--tab-on:#F2F2F4;--tab-on-t:#0D0D0F;--tab-off:#8E8E96;
--hero:radial-gradient(260px 160px at 85% 0%,rgba(255,255,255,.12),rgba(255,255,255,0) 70%) padding-box,linear-gradient(160deg,#2E2E34 0%,#1B1B1F 50%,#121214 100%) padding-box,linear-gradient(135deg,#FFFFFF 0%,#6E6E76 35%,#DADADF 60%,#4A4A51 100%) border-box;
--hero-sh:0 18px 40px rgba(0,0,0,.5);--hero-m:#B9B9C1;--flota-b:rgba(255,255,255,.10);
color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:var(--pie);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--tx)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--fondo)}
.ic{display:block;flex-shrink:0}
.mut{color:var(--tx2)}.sm{font-size:13px}.center{text-align:center}.mt{margin-top:12px}
.t1{margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.4px}
h2{margin:0 0 6px;font-size:20px;font-weight:800}
.pant{display:flex;flex-direction:column;gap:12px}
.pad{padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
.pad-tab{padding:calc(18px + env(safe-area-inset-top)) 16px calc(116px + env(safe-area-inset-bottom))}
.con-pie{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.top-esp{height:24px}
.card{background:var(--card-g);border:1px solid var(--card-b);box-shadow:var(--sombra);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-tt{font-size:15px;font-weight:800;padding-bottom:4px}
.enlace{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;width:100%}
.enlace span{display:flex;flex-direction:column;gap:2px}
.btn{box-shadow:var(--btn-sh);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:26px;background:var(--neg);color:var(--neg-t);font-size:16px;font-weight:700;padding:0 18px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--sec);color:var(--tx);border:1px solid var(--sec-b);box-shadow:none}
.btn.rojo{background:#C62828;color:#fff}.btn.verde{background:#0F7A47;color:#fff}
.btn+.btn{margin-top:8px}
.btn-neg{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;border:0;background:var(--neg);color:var(--neg-t);font-size:14px;font-weight:700;white-space:nowrap}
.btn-o{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--sec-b);background:var(--sec);font-size:13px;font-weight:700;white-space:nowrap}
.btn-dash{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:48px;border-radius:24px;border:1.5px dashed var(--borde2);background:transparent;font-size:14px;font-weight:700}
.link{border:0;background:none;padding:8px 2px;font-size:14px;font-weight:700;color:var(--tx);text-decoration:none}
.rojo-t{color:var(--rojo)}.verde-t{color:var(--verde);display:flex;align-items:center;gap:6px}
.redondo{width:44px;height:44px;border-radius:22px;border:1px solid var(--borde);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.redondo.gris{background:var(--suave);border:0;width:40px;height:40px}
.redondo.sm{width:34px;height:34px}
.redondo:disabled{opacity:.35}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fila2 .btn+.btn{margin-top:0}
.pie-fijo{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(var(--pie0),var(--pie) 26%);display:flex;flex-direction:column;gap:8px;z-index:5}
.pie-fijo .btn+.btn{margin-top:0}
/* acceso */
.acc{padding:calc(40px + env(safe-area-inset-top)) 22px 40px;display:flex;flex-direction:column;gap:16px}
.acc-top{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-bottom:8px}
.acc-top h1{margin:8px 0 0;font-size:26px;font-weight:800}
.acc-top p{margin:0}
.acc-f{display:flex;flex-direction:column;gap:12px}
.acc-pie{margin-top:10px}
/* la foto al entrar (16 nov 2026) */
.acc-foto{position:relative}
.acc-ft{position:absolute;left:0;right:0;top:0;height:50vh;min-height:320px;background:#111 url(/img/acceso.webp) center 24%/cover no-repeat}
.acc-ft:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,.05) 32%,rgba(0,0,0,0) 58%,var(--pie) 100%)}
.acc-ftx{display:none}
.acc-foto>*:not(.acc-ft){position:relative}
.acc-foto .acc-top svg{color:#fff!important;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));margin-bottom:calc(50vh - 150px)}
@media (min-width:900px){
  body:has(.acc-foto) #app{margin-left:50vw;max-width:none;display:flex;justify-content:center}
  body:has(.acc-foto) #app>.acc{width:100%;max-width:480px}
  .acc-ft{position:fixed;top:0;bottom:0;right:auto;width:50vw;height:auto;min-height:0;background-position:center 30%}
  .acc-ft:after{background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
  .acc-ftx{display:block;position:absolute;left:40px;bottom:36px;right:40px;z-index:1;color:#fff;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.2;max-width:360px}
  .acc-foto .acc-top svg{color:var(--tx)!important;filter:none;margin-bottom:0}
}
.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--tx2)}
.f input,.f textarea,.f select{height:50px;border:1px solid var(--borde2);border-radius:14px;padding:0 14px;font-size:16px;font-weight:600;color:var(--tx);background:var(--card);outline:0}
.f input:focus{border-color:var(--tx)}
.f input.grande{font-size:18px;font-weight:800;border:1.5px solid var(--tx)}
.pw{position:relative;display:flex}.pw input{flex:1;padding-right:48px}
.pw-v{position:absolute;right:4px;top:3px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--tx2)}
.chk input{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:var(--tx)}
.msg{margin:0;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.4}
.msg.err{background:var(--rojo-bg);color:var(--rojo-tx)}.msg.ok{background:var(--verde-bg);color:var(--verde-tx)}
.seg2,.seg3{display:grid;grid-template-columns:1fr 1fr;background:var(--seg);border-radius:14px;padding:4px;gap:4px}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg2 button,.seg3 button{height:40px;border:0;border-radius:11px;background:transparent;color:var(--tx2);font-size:14px;font-weight:700}
.seg2 button.on,.seg3 button.on{background:var(--seg-on);box-shadow:0 2px 8px rgba(13,13,15,.10);color:var(--tx);font-weight:800}
/* preguntas */
.preg-cab{display:flex;align-items:center;justify-content:space-between}
.barras{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.barras i{height:5px;border-radius:3px;background:var(--gris)}.barras i.on{background:var(--neg)}
.lista-opc{display:flex;flex-direction:column;gap:10px}
.opc{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:62px;padding:12px 16px;border-radius:18px;background:var(--card);border:1px solid var(--borde);text-align:left}
.opc.on{border:2px solid var(--tx);padding:11px 15px}
.opc span{display:flex;flex-direction:column;gap:2px}.opc b{font-size:16px}.opc small{font-size:13px;color:var(--tx2);line-height:1.4}
.punto{width:22px;height:22px;border-radius:11px;flex-shrink:0;border:2px solid var(--borde2)}
.on>.punto{border:7px solid var(--tx)}
.dias7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{height:44px;border-radius:22px;border:1px solid var(--chip-b);background:var(--chip);color:var(--chip-t);font-weight:700;padding:0}
.dia.on{background:var(--neg);border-color:var(--tx);color:var(--neg-t)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--chip-b);background:var(--chip);color:var(--chip-t);font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--neg);border-color:var(--tx);color:var(--neg-t)}
.lab{font-size:15px;font-weight:800;margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* tu plan */
.semana7{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 8px}
.d7{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--tx3)}
.d7 i{width:34px;height:34px;border-radius:17px;background:var(--suave2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.d7.on{color:var(--tx)}.d7.on i{background:var(--neg);color:var(--neg-t)}
.dia-c{padding:4px 14px}
.dia-h{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;background:none;text-align:left}
.dia-h[aria-expanded=true] .ic:last-child{transform:rotate(180deg)}
.letra{width:38px;height:38px;border-radius:19px;background:var(--neg);color:var(--neg-t);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dia-t{display:flex;flex-direction:column;flex:1}.dia-t small{font-size:12px;color:var(--tx2)}
.cal{background:var(--suave);border-radius:12px;padding:8px 10px;font-size:12px;margin-bottom:4px}
.ej-f{display:flex;align-items:center;gap:8px;min-height:48px;border-top:1px solid var(--linea)}
.ej-n{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;flex:1;min-width:0}
.ej-n b{font-size:14px;font-weight:700}.ej-n small{font-size:12px;color:var(--tx2)}
.lista{display:flex;flex-direction:column;max-height:60vh;overflow:auto;margin:0 -4px}
.fila-b{display:flex;flex-direction:column;gap:2px;width:100%;padding:12px 4px;border:0;border-top:1px solid var(--linea);background:none;text-align:left}
.fila-b:first-child{border-top:0}
.fila-b b{font-size:15px}.fila-b small{font-size:12px;color:var(--tx2)}
.fila-b.on{background:var(--suave);border-radius:12px;padding-left:10px}
/* inicio */
.ini-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px}
.ini-cab span{display:flex;flex-direction:column}
.hoy-c{background:var(--hero);border:1.5px solid transparent;box-shadow:var(--hero-sh);color:#fff;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hoy-t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hoy-t>span{display:flex;flex-direction:column;gap:4px}
.hoy-t small{font-size:12px;font-weight:700;letter-spacing:.6px;color:#BDBDC4}
.hoy-t b{font-size:22px;font-weight:800}.hoy-t>span>span{font-size:13px;color:#D8D8DE}
.hoy-t>b.plata{font-family:'Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.8px;overflow-wrap:anywhere;background:linear-gradient(180deg,#FFFFFF 0%,#A7A7AF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hoy-t em{font-style:normal;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px;white-space:nowrap}
.btn.bl{background:#fff;color:#0E0E10;font-weight:800;min-height:54px;border-radius:27px;box-shadow:none}
.bl2{color:#D8D8DE;align-self:center;padding:0}
.sem7{display:grid;grid-template-columns:repeat(7,1fr)}

.cq-lk.on{background:var(--neg);color:var(--neg-t);border-color:var(--neg)}
.cq-f.quita b{text-decoration:line-through;color:var(--tx3)}
.cq-n{margin:6px 0 0}.cq-b{margin-top:10px}
.verde-t{color:var(--verde-tx);display:inline-flex;align-items:center;gap:4px}
.n-cop2{margin:-4px 0 6px 6px}
/* comparar lado a lado y un ejercicio semana a semana */
.cmpe .card-h .seg-p button{height:32px;font-size:12.5px;padding:0 12px}
.cm-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.cm-t{background:var(--suave);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.cm-t small{font-size:11.5px}.cm-t b{font-size:17px;font-family:'Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cm-pl{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.cm-pl.up{background:var(--verde-bg);color:var(--verde-tx)}.cm-pl.dn{background:var(--rojo-bg);color:var(--rojo)}.cm-pl.eq{background:var(--suave);color:var(--tx2)}
.cm-e{border-top:1px solid var(--linea);padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:6px}
.cm-en{display:flex;justify-content:space-between;align-items:center;gap:8px}.cm-en b{font-size:14px}
.cm-c{background:var(--suave);border-radius:10px;padding:6px 10px}.cm-c.vacio{display:flex;align-items:center;justify-content:center;min-height:34px}
.cm-s{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:3px 0;font-family:'Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif}
.cm-up{color:var(--verde-tx);display:inline-flex}.cm-dn{color:var(--rojo);display:inline-flex;transform:rotate(180deg)}.cm-eq{color:var(--tx3);font-style:normal;font-weight:800}
.cm-sub{margin-top:6px}.cm-res{margin:2px 0 0;display:flex;align-items:center;gap:6px;color:var(--tx2)}
.sw{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.sw-c{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;scroll-snap-align:end;color:var(--tx)}
.sw-v{font-size:12px;font-weight:800;color:var(--tx2);white-space:nowrap}.sw-c.ult .sw-v{color:var(--tx)}
.sw-b{height:96px;width:46px;display:flex;align-items:flex-end;border-bottom:1px solid var(--borde)}.sw-b i{display:block;width:100%;border-radius:8px 8px 0 0;background:var(--tx3)}
.sw-c.ult .sw-b i{background:var(--tx)}
.sw-f{font-size:11.5px;color:var(--tx2)}.sw-c.ult .sw-f{color:var(--tx);font-weight:800}
.sw-z{display:flex;flex-direction:column;gap:2px;width:100%;background:var(--suave);border-radius:10px;padding:5px 2px;font-size:12px;font-family:'Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif}
.sw-c.ult .sw-z{box-shadow:inset 0 0 0 1.5px var(--tx)}
/* cuenta atrás de las series por tiempo y del cardio */
.cta-b{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border-radius:16px;border:0;background:var(--neg);color:var(--neg-t);font-size:14px;font-weight:700;margin:2px 0 4px}
.cta-b b{font-family:'Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif;font-size:16px}
.cta-pb{display:block;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}.cta-pb i{display:block;height:100%;background:#fff;border-radius:3px}
.cta-ay{font-size:12px;color:#9a9aa2}
.d-au{position:absolute;left:12px;right:12px;top:-30px;height:26px;border:0;border-radius:13px;background:var(--neg);color:var(--neg-t);font-size:12px;font-weight:700}
.cta-c>small.cta-ay{text-transform:none;letter-spacing:0;font-weight:600;font-size:12.5px}
.cm-l{margin:2px 0 -2px}.cm-f{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.cm-tt{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;background:var(--suave);border-radius:12px;padding:9px 12px;font-size:13.5px}
.cm-tt b{font-family:'Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif;font-size:15px}
.n-m3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:2px 0 4px}
.n-m3f{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:12px}
.n-m3f>span{display:flex;align-items:center;gap:3px;white-space:nowrap;color:var(--tx);font-weight:600}.n-m3f>span small{color:var(--tx2);font-weight:600;font-size:11.5px}
.n-m3f>span b{font-family:'Space Grotesk','Plus Jakarta Sans',system-ui,sans-serif;font-weight:700}
.n-m3f>i{height:4px;border-radius:2px;width:100%}.n-m3f>i>i{border-radius:2px}
.n-m3f.pasa>span,.n-m3f.pasa>span small{color:var(--rojo)}.n-m3f.ok>span,.n-m3f.ok>span small{color:var(--verde-tx)}
/* Inicio: tocar otro día */
.sem7.v2 button.s7{border:1px solid transparent;font:inherit;cursor:pointer;width:100%}
.sem7.v2.osc button.s7.lib{border-color:transparent}
.sem7.v2.osc .s7.hoyR{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.hoy-c.otro .hoy-sh{background:rgba(255,255,255,.14)}
.hoy-2{gap:8px}.hoy-c .btn.sec.osc{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28)}
.rr-cal{display:flex;gap:6px;align-items:flex-start;color:var(--tx2);margin:0}
.rr-l{margin:4px 0 8px;padding-left:22px;display:flex;flex-direction:column;gap:8px}.rr-l li{padding-left:2px}.rr-l li b{display:block;font-size:14.5px}.rr-l li small{font-size:12.5px}
/* buscar en Open Food Facts */
.off{display:flex;flex-direction:column;gap:6px;padding:8px 0 4px;border-top:1px solid var(--linea)}
.off .btn{margin:0}.off small{font-size:12px}.off-t{margin:2px 0}
.off-k{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;font-weight:700;white-space:nowrap}.off-k em{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--suave);color:var(--tx2)}
/* foto en las publicaciones de Comunidad */
.cm-foto{margin:2px -2px 2px;border-radius:16px;overflow:hidden;background:var(--suave);aspect-ratio:4/5}
.cm-foto img{width:100%;height:100%;object-fit:cover;display:block}
.cp-foto{margin:2px 0}.cp-f{display:flex;flex-direction:column;align-items:center;gap:6px}.cp-f .crop-z{width:100%}
.cp-crop{border-radius:16px}

/* deslizar para quitar un alimento */
.n-sw{position:relative;overflow:hidden;border-top:1px solid var(--linea);background-clip:padding-box;transition:height .2s}
.n-sw.mueve,.n-sw.abierto,.n-sw.fuera{background-color:var(--rojo)}
.n-sw>.n-it{position:relative;z-index:1;border-top:0;background:var(--card);transition:transform .2s ease;touch-action:pan-y}
.n-sw.mueve>.n-it{transition:none}
.n-sw-q{position:absolute;top:0;right:0;bottom:0;width:84px;border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800}
.n-sw.borra .n-sw-q{width:100%;align-items:flex-end;padding-right:26px}
.n-sw.fuera{opacity:.4}
.toast-b{margin-left:auto;flex-shrink:0;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:800;border-radius:10px;padding:6px 12px;font-size:13px}
/* omitir y repartir */
.n-om{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 4px;padding:6px 8px 6px 10px;border-radius:10px;background:var(--rojo-bg);color:var(--rojo-tx);font-size:12.5px;font-weight:700}
.n-om.ok{background:var(--sec-b);color:var(--tx2);font-weight:600}
.n-om .link{font-size:12.5px;font-weight:800;color:var(--tx);padding:0}

/* la media de la semana, cerrada en una línea (se abre al tocarla) */
button.card.n-semc{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;width:100%;text-align:left;font:inherit;color:var(--tx);cursor:pointer;padding:14px 16px}
.n-semc .col{flex:1;min-width:0;align-items:flex-start}.n-semc b{font-size:15px}.n-semc small{display:block;font-size:13px}
.n-semc>svg:last-child{color:var(--tx2);flex:none}
.n-semv{position:relative}.n-semv .card-h{padding-right:34px}
.n-semx{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:0;background:var(--sec-b);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}.n-semx svg{transform:rotate(180deg)}

/* ---------- programas de carrera completos (correr.js) ---------- */
.rp-niv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--seg);border-radius:14px;padding:4px}
.rp-niv button{border:0;background:none;height:34px;border-radius:10px;font-weight:700;font-size:13px;color:var(--tx2)}
.rp-niv button.on{background:var(--seg-on);color:var(--tx);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.rp-p{display:flex;flex-direction:column;gap:6px;padding:12px 0;border:0;border-top:1px solid var(--linea);background:none;text-align:left;width:100%;color:var(--tx)}
.rp-p:first-of-type{border-top:0}
.rp-p .t{display:flex;align-items:center;gap:10px}.rp-p .t b{font-size:15.5px;flex:1}
.rp-p .m{font-size:12.5px;color:var(--tx2)}.rp-p .q{font-size:12.5px;color:var(--tx3)}
.rp-tags{display:flex;gap:6px;flex-wrap:wrap}
.rp-tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--suave);color:var(--tx2)}
.rp-tag.ok{background:var(--verde-bg);color:var(--verde-tx)}
.rp-lib b{font-size:15px}
.rp-hero{background:var(--hero);border:1px solid transparent;box-shadow:var(--hero-sh);border-radius:24px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:8px}
.rp-hero h2{margin:0;font-size:21px;line-height:1.2}.rp-hero small{color:var(--hero-m)}
.rp-kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.rp-kp div{background:rgba(255,255,255,.09);border-radius:12px;padding:8px 4px;text-align:center}
.rp-kp b{display:block;font-size:16px}.rp-kp small{font-size:10.5px}
.rp-fases{display:flex;gap:3px}
.rp-fases div{flex:1;border-radius:8px;padding:6px;background:var(--suave);font-size:11px;line-height:1.25}
.rp-fases div b{display:block;font-size:11.5px}
.rp-fases div.on{background:var(--neg);color:var(--neg-t)}
.rp-w{display:flex;align-items:center;gap:10px;padding:10px 0;border:0;border-top:1px solid var(--linea);background:none;width:100%;text-align:left;font-size:14px;color:var(--tx)}
.rp-w .n{width:34px;height:34px;border-radius:12px;background:var(--suave);display:flex;align-items:center;justify-content:center;font-weight:800;font-style:normal;flex-shrink:0}
.rp-w .n.on{background:var(--neg);color:var(--neg-t)}.rp-w .n.ok{background:var(--verde-bg);color:var(--verde-tx)}
.rp-w span{flex:1;display:flex;flex-direction:column}.rp-w small{color:var(--tx2);font-size:12px}
.rp-ses{display:flex;flex-direction:column;gap:6px;padding:0 0 8px 44px}
.rp-ses button{border:0;background:var(--suave);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;text-align:left;color:var(--tx)}
.rp-ses button span{display:flex;flex-direction:column;gap:2px}.rp-ses small{color:var(--tx2)}.rp-ses .mn{white-space:nowrap}
.rp-regla{background:var(--suave);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45}
.rp-li{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}
.rp-h{font-size:13px;font-weight:800;margin:6px 0 0}
.rp-mini{font-size:12.5px;background:var(--ambar-bg);color:var(--ambar-tx);border-radius:12px;padding:8px 10px;line-height:1.4}
.rp-aviso{display:flex;gap:8px;align-items:flex-start;font-size:13px;background:var(--ambar-bg);color:var(--ambar-tx);border-radius:12px;padding:8px 10px;line-height:1.4}
.rp-dots{display:flex;gap:6px}
.rp-dots span{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:32px;border-radius:10px;background:var(--suave);font-size:12.5px;font-weight:700;color:var(--tx2)}
.rp-dots span.ok{background:var(--verde-bg);color:var(--verde-tx)}
.rp-st{font-size:19px}.rp-big{font-size:26px}
.rp-q{height:30px;font-size:12px;display:flex;align-items:center;gap:4px}
.rp-tot{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}.rp-tot i{display:block}
.rp-ley{display:flex;gap:12px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.rp-ley i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rp-bl{gap:6px}
.rp-bh{display:flex;align-items:center;gap:10px}
.rp-bh .l{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;font-style:normal;flex-shrink:0}
.rp-bh b{flex:1;font-size:15.5px}.rp-bh small{color:var(--tx2);font-weight:700}
.rp-bt{font-size:17px;line-height:1.3}
.rp-ej{display:flex;align-items:center;gap:8px;border-top:1px solid var(--linea)}
.rp-ej.on .rp-en b{text-decoration:line-through;color:var(--tx2)}
.rp-en{flex:1;display:flex;align-items:center;gap:10px;padding:9px 0;border:0;background:none;text-align:left;font-size:14px;color:var(--tx);min-width:0}
.rp-en.sola{border-top:1px solid var(--linea);width:100%}
.rp-en span{flex:1;display:flex;flex-direction:column;min-width:0}.rp-en small{color:var(--tx2);font-size:12px}
.rp-en em{font-style:normal;font-weight:700;font-size:13px;white-space:nowrap}
.rp-ck{width:28px;height:28px;border-radius:14px;border:2px solid var(--borde2);background:none;display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0;padding:0}
.rp-ck.on{background:var(--verde);border-color:var(--verde);color:#fff}
.rp-int{display:flex;gap:2px;align-items:flex-end;height:46px}.rp-int i{display:block;border-radius:4px}
.rp-rpe{font-size:12.5px;color:var(--tx2);line-height:1.45;margin:0}
.rp-vid{height:170px;border-radius:18px;background:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--tx3);font-size:13px}
.rp-dl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.rp-dl div{background:var(--suave);border-radius:12px;padding:8px;font-size:12px;color:var(--tx2)}
.rp-dl b{display:block;color:var(--tx);font-size:13.5px}
.rp-sw{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.3px;color:var(--tx2);text-transform:uppercase}
.rp-encurso{display:flex;flex-direction:column;gap:12px}
.rp-reg{gap:10px}
.rp-q2{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.rp-sn{display:flex;gap:6px}
.rp-sn button{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--chip-b);background:var(--chip);color:var(--chip-t);font-weight:700;font-size:13px}
.rp-sn button.on{background:var(--neg);border-color:var(--tx);color:var(--neg-t)}
.rp-rpeb{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.rp-rpeb button{height:34px;border-radius:9px;border:1px solid var(--chip-b);background:var(--chip);color:var(--chip-t);font-weight:800;font-size:13px;padding:0}
.rp-rpeb button.on{background:var(--neg);border-color:var(--tx);color:var(--neg-t)}
.rp-rpeb button.alto.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.rp-esc{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:-4px}
.rp-mat{display:flex;align-items:flex-start;gap:6px;margin:0;font-size:13px;color:var(--tx2)}
.rp-mat .ic{flex-shrink:0;margin-top:1px}
.rp-rep{display:inline-flex;align-items:center;gap:6px}
.rp-ses .mn.ok{display:inline-flex;align-items:center;gap:3px;color:var(--verde);font-weight:700}
.rp-reg .run-in{margin-top:2px}

/* 17 nov (Javier, Word «bloque de programación»): cronómetro de carrera, cronometrar ejercicios del calentamiento, notas y días ocupados */
.rc{display:flex;flex-direction:column;gap:10px}.rc-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.rc-h b{display:flex;align-items:center;gap:6px;font-size:15px}
.rc-f{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--suave);transition:background .3s}
.rc-f span{font-size:14px;font-weight:800;letter-spacing:.3px}.rc-f b{font-size:52px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}.rc-f small{font-size:12.5px;color:var(--tx2);text-align:center}
.rc-f.on{background:var(--neg);color:var(--neg-t)}.rc-f.on small{color:inherit;opacity:.8}
.rc-f.off{background:var(--verde-bg);color:var(--verde-tx)}.rc-f.fin{background:var(--verde-bg);color:var(--verde-tx)}
.rc-bar{height:8px;border-radius:4px;background:var(--suave);overflow:hidden}.rc-bar i{display:block;height:100%;background:var(--neg);border-radius:4px;transition:width .25s linear}
.rc-b{display:flex;gap:8px;flex-wrap:wrap}.rc-b .btn{flex:1;min-width:130px}.rc-b .link{width:100%}
.rc-ley{display:flex;gap:6px;align-items:flex-start;margin:0}.rc-ley .ic{flex-shrink:0;margin-top:2px}
.rp-ej.con-tm .rp-en{padding-right:2px}
.rp-tm{flex-shrink:0;min-width:38px;height:34px;border-radius:17px;border:1px solid var(--borde2);background:var(--card);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-size:12.5px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}
.rp-tm.on{background:var(--neg);color:var(--neg-t);border-color:var(--neg)}
.rp-nota textarea{width:100%;resize:vertical;min-height:70px}
.rp-nt{display:flex;gap:6px;align-items:flex-start;margin:6px 0 0}.rp-nt .ic{flex-shrink:0;margin-top:2px}
.rp-dots span.toca{background:var(--neg);color:var(--neg-t)}
.rp-orden{display:flex;gap:6px;align-items:flex-start;margin:2px 0 0}.rp-orden .ic{flex-shrink:0;margin-top:2px}
.pd-d button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.05}
.pd-d button small{font-size:10px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-d button.otra{background:var(--ambar-bg);color:var(--ambar-tx);border:1px solid var(--ambar-b);border-style:solid}
.pd-i.otra{background:var(--ambar-bg);border:1px solid var(--ambar-b);border-style:solid}
.pd-nota{display:flex;gap:6px;align-items:flex-start}.pd-nota .ic{flex-shrink:0;margin-top:2px}


/* 17 nov (Word de programación): la vista de cada ejercicio como la de los clientes de los entrenadores (series.js) */
.ej-acc4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ej-acc4 button{height:40px;border-radius:14px;border:1px solid var(--sec-b);background:var(--sec);display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--tx);padding:0 4px;min-width:0}

lateral":"sí","mancuernas":"no"},{"nombre":"Ankling (técnica de tobillos)","grupo":"Cardio","grupos":"Técnica de carrera, Calentamiento de carrera","equipo":"corporal","patron":"cardio","nivel":"principiante","modalidad":"cardio","funcion":"accesoria","zona":"tobillo","unilateral":"no","mancuernas":"no","indicaciones":"Pasos muy cortos y rápidos casi sin doblar las rodillas: apoya la parte delantera del pie debajo de la cadera y empuja con el tobillo. Tronco alto. 2 × 20 m.","_nuevo":1},{"nombre":"A-march (marcha técnica)","grupo":"Cardio","grupos":"Técnica de carrera, Calentamiento de carrera","equipo":"corporal","patron":"cardio","nivel":"principiante","modalidad":"cardio","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Caminando, sube una rodilla a la altura de la cadera con la punta del pie hacia arriba y bájala con decisión, apoyando debajo del cuerpo. El brazo contrario acompaña. 2 × 20 m.","_nuevo":1},{"nombre":"A-run","grupo":"Cardio","grupos":"Técnica de carrera","equipo":"corporal","patron":"cardio","nivel":"intermedio","modalidad":"cardio","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Como el skipping A pero avanzando más, casi corriendo: rodilla arriba, apoyo activo debajo de la cadera y brazos coordinados. Ritmo ágil sin perder la postura. 2 × 20 m.","_nuevo":1},{"nombre":"Carrera con piernas rectas","grupo":"Cardio","grupos":"Técnica de carrera","equipo":"corporal","patron":"cardio","nivel":"intermedio","modalidad":"cardio","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Avanza con las piernas casi estiradas, como unas tijeras, apoyando la parte delantera del pie debajo del cuerpo y tirando del suelo hacia atrás. Tronco alto. 2 × 20 m.","_nuevo":1},{"nombre":"Técnica de carrera contra la pared (wall drill)","grupo":"Cardio","grupos":"Técnica de carrera","equipo":"corporal","patron":"cardio","nivel":"principiante","modalidad":"cardio","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Manos en la pared y el cuerpo inclinado en línea. Sube una rodilla a la altura de la cadera y cambia de pierna con un gesto rápido, apoyando debajo del cuerpo. 2 × 10 por pierna.","_nuevo":1},{"nombre":"Skipping a una pierna","grupo":"Cardio","grupos":"Técnica de carrera","equipo":"corporal","patron":"cardio","nivel":"intermedio","modalidad":"cardio","funcion":"accesoria","unilateral":"sí","mancuernas":"no","indicaciones":"Avanzando despacio, haz el gesto del skipping solo con una pierna mientras la otra acompaña con pasos normales. Luego cambia. 2 × 15 m por pierna.","_nuevo":1},{"nombre":"Marcha con rodillas arriba","grupo":"Cardio","grupos":"Técnica de carrera, Calentamiento de carrera","equipo":"corporal","patron":"cardio","nivel":"principiante","modalidad":"cardio","funcion":"accesoria","zona":"cadera","unilateral":"no","mancuernas":"no","indicaciones":"Caminando con el tronco alto, sube cada rodilla a la altura de la cadera y apoya con la parte delantera del pie. Los brazos acompañan. 2 × 15 m.","_nuevo":1},{"nombre":"Carrera sobre minivallas (wickets)","grupo":"Cardio","grupos":"Técnica de carrera","equipo":"otro","patron":"cardio","nivel":"avanzado","modalidad":"cardio","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Corre sobre minivallas o marcas separadas a la misma distancia, con zancada regular, rodillas arriba y apoyos rápidos debajo del cuerpo. 3 × 20 m.","_nuevo":1},{"nombre":"Carrera hacia atrás","grupo":"Cardio","grupos":"Técnica de carrera, Calentamiento de carrera","equipo":"corporal","patron":"cardio","nivel":"intermedio","modalidad":"cardio","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Trota hacia atrás con pasos cortos, apoyando primero la parte delantera del pie y con el tronco un poco inclinado hacia delante. En un sitio despejado. 2 × 20 m.","_nuevo":1},{"nombre":"Zancadas dinámicas","grupo":"Cuádriceps","grupos":"Calentamiento de carrera","equipo":"corporal","patron":"zancada","nivel":"principiante","modalidad":"funcional","funcion":"accesoria","zona":"cadera","unilateral":"sí","mancuernas":"no","indicaciones":"Da un paso largo, baja la rodilla de atrás sin apoyarla y empuja con la de delante para dar el siguiente paso. Tronco recto y la rodilla de delante sobre el pie. 8 por pierna.","_nuevo":1},{"nombre":"Elevaciones de talones con rodillas flexionadas (sóleo)","grupo":"Gemelo","grupos":"Calentamiento de carrera","equipo":"corporal","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","zona":"tobillo","unilateral":"no","mancuernas":"no","indicaciones":"De pie y apoyada en algo, con las rodillas un poco dobladas, sube de puntillas sin estirarlas y baja despacio sin rebotar. 12-15.","_nuevo":1},{"nombre":"Puente de glúteos","grupo":"Glúteo","grupos":"Calentamiento de carrera","equipo":"corporal","patron":"puente","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","zona":"gluteo","unilateral":"no","mancuernas":"no","indicaciones":"Tumbada boca arriba con las rodillas dobladas, aprieta los glúteos y sube la cadera hasta alinearla con rodillas y hombros. Pausa arriba y baja despacio. 12-15.","_nuevo":1},{"nombre":"Elevaciones de punteras (tibial anterior)","grupo":"Otro","grupos":"Calentamiento de carrera","equipo":"corporal","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","zona":"tobillo","unilateral":"no","mancuernas":"no","indicaciones":"Con la espalda apoyada en una pared y los talones algo separados de ella, sube las puntas de los pies hacia la espinilla y bájalas despacio. 12-15.","_nuevo":1},{"nombre":"Equilibrio monopodal con elevación de rodilla","grupo":"Movilidad","grupos":"Calentamiento de carrera","equipo":"corporal","patron":"movilidad","nivel":"principiante","modalidad":"movilidad","funcion":"accesoria","zona":"tobillo,cadera","unilateral":"sí","mancuernas":"no","indicaciones":"Sobre una pierna, sube la otra rodilla a la altura de la cadera y aguanta quieta con el tronco alto, sin que la rodilla de apoyo se vaya hacia dentro. 20 s por pierna.","_nuevo":1},{"nombre":"Caminata de puntillas","grupo":"Gemelo","grupos":"Calentamiento de carrera","equipo":"corporal","patron":"aislamiento","nivel":"principiante","modalidad":"movilidad","funcion":"accesoria","zona":"tobillo","unilateral":"no","mancuernas":"no","indicaciones":"Camina sobre la parte delantera del pie con los talones arriba, pasos cortos y tobillos firmes. 15 m.","_nuevo":1},{"nombre":"Caminata sobre talones","grupo":"Otro","grupos":"Calentamiento de carrera","equipo":"corporal","patron":"aislamiento","nivel":"principiante","modalidad":"movilidad","funcion":"accesoria","zona":"tobillo","unilateral":"no","mancuernas":"no","indicaciones":"Camina apoyando solo los talones, con las puntas de los pies arriba y el tronco alto. 15 m.","_nuevo":1},{"nombre":"Círculos de rodilla","grupo":"Movilidad","grupos":"Calentamiento de carrera","equipo":"corporal","patron":"movilidad","nivel":"principiante","modalidad":"movilidad","funcion":"accesoria","zona":"rodilla","unilateral":"no","mancuernas":"no","indicaciones":"Pies juntos, rodillas un poco flexionadas y manos sobre ellas: dibuja círculos pequeños y suaves, 8 hacia cada lado, sin levantar los talones.","_nuevo":1},{"nombre":"Saltos de tobillo a una pierna","grupo":"Gemelo","grupos":"Pliometría","equipo":"corporal","patron":"salto","nivel":"intermedio","modalidad":"funcional","funcion":"accesoria","zona":"tobillo","unilateral":"sí","mancuernas":"no","indicaciones":"Sobre una pierna, saltitos cortos rebotando con la parte delantera del pie, rodilla casi estirada y contacto muy corto. 2 × 8 por pierna.","_nuevo":1},{"nombre":"Multisaltos alternos (bounding)","grupo":"Cuerpo completo","grupos":"Pliometría, Técnica de carrera","equipo":"corporal","patron":"salto","nivel":"avanzado","modalidad":"funcional","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Zancadas largas saltando de una pierna a la otra, empujando fuerte contra el suelo y llevando la rodilla de delante arriba. Aterriza estable antes de seguir. 2 × 20 m.","_nuevo":1},{"nombre":"Saltos cortos hacia delante","grupo":"Cuerpo completo","grupos":"Pliometría","equipo":"corporal","patron":"salto","nivel":"intermedio","modalidad":"funcional","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Con los pies juntos, saltos cortos y seguidos hacia delante rebotando rápido, sin pararte entre uno y otro. Aterriza suave. 2 × 10.","_nuevo":1},{"nombre":"Skipping explosivo","grupo":"Cardio","grupos":"Pliometría, Técnica de carrera","equipo":"corporal","patron":"salto","nivel":"avanzado","modalidad":"funcional","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Skipping con impulso: sube la rodilla rápido y empuja fuerte el suelo con la pierna de apoyo para ganar altura en cada paso. 2 × 15 m.","_nuevo":1},{"nombre":"Saltos laterales sobre una línea","grupo":"Cuerpo completo","grupos":"Pliometría","equipo":"corporal","patron":"salto","nivel":"intermedio","modalidad":"funcional","funcion":"accesoria","zona":"tobillo","unilateral":"no","mancuernas":"no","indicaciones":"Pies juntos al lado de una línea: salta de un lado al otro rápido, con contactos cortos y sin pisarla. 2 × 15.","_nuevo":1},{"nombre":"Saltos verticales con contramovimiento (CMJ)","grupo":"Cuerpo completo","grupos":"Pliometría","equipo":"corporal","patron":"salto","nivel":"intermedio","modalidad":"funcional","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Baja rápido flexionando cadera y rodillas y salta lo más alto que puedas ayudándote de los brazos. Aterriza suave y recupera antes del siguiente. 2 × 6.","_nuevo":1},{"nombre":"Saltos sobre minivallas","grupo":"Cuerpo completo","grupos":"Pliometría","equipo":"otro","patron":"salto","nivel":"avanzado","modalidad":"funcional","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Salta con los pies juntos por encima de minivallas seguidas, rebotando rápido entre una y otra con contactos cortos. 2 × 6.","_nuevo":1},{"nombre":"Drop jumps (salto desde cajón)","grupo":"Cuerpo completo","grupos":"Pliometría","equipo":"otro","patron":"salto","nivel":"avanzado","modalidad":"funcional","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Déjate caer desde un cajón bajo y, al tocar el suelo, rebota hacia arriba lo más rápido posible. Pocas repeticiones y mucha calidad. 2-3 × 5.","_nuevo":1},{"nombre":"Saltos horizontales","grupo":"Cuerpo completo","grupos":"Pliometría","equipo":"corporal","patron":"salto","nivel":"intermedio","modalidad":"funcional","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Desde parada, salta hacia delante lo más lejos que puedas con los dos pies, ayudándote de los brazos, y aterriza estable con las rodillas flexionadas. 2-3 × 5.","_nuevo":1},{"nombre":"Saltos laterales a una pierna","grupo":"Cuerpo completo","grupos":"Pliometría","equipo":"corporal","patron":"salto","nivel":"intermedio","modalidad":"funcional","funcion":"accesoria","zona":"tobillo","unilateral":"sí","mancuernas":"no","indicaciones":"Sobre una pierna, salta de lado a lado de una línea con contactos cortos y la rodilla estable, sin que se vaya hacia dentro. 2 × 8 por pierna.","_nuevo":1},{"nombre":"Sentadilla con salto","grupo":"Cuerpo completo","grupos":"Pliometría","equipo":"corporal","patron":"salto","nivel":"principiante","modalidad":"funcional","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Baja a media sentadilla y salta hacia arriba. Aterriza suave, flexionando rodillas y cadera, y vuelve a empezar. 2-3 × 6-8.","_nuevo":1},{"nombre":"Peso muerto con barra hexagonal","grupo":"Cuádriceps","grupos":"Isquiosurales, Glúteo","equipo":"barra","patron":"bisagra","nivel":"intermedio","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"Dentro de la barra hexagonal, agarra las asas, espalda neutra y empuja el suelo con las piernas hasta quedar de pie. Baja controlando.","_nuevo":1},{"nombre":"Zancada lateral","grupo":"Aductores","grupos":"Glúteo, Cuádriceps","equipo":"corporal","patron":"zancada","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"sí","mancuernas":"no","indicaciones":"Da un paso amplio hacia un lado y baja flexionando esa rodilla, con la otra pierna estirada y el pecho alto. Empuja para volver. 8 por lado.","_nuevo":1},{"nombre":"Suitcase carry (acarreo a una mano)","grupo":"Core","equipo":"mancuernas","patron":"acarreo","nivel":"principiante","modalidad":"funcional","funcion":"accesoria","unilateral":"sí","mancuernas":"sí","indicaciones":"Camina con una mancuerna o kettlebell pesada en una sola mano, el tronco recto sin inclinarte hacia el peso y los hombros nivelados. 2 × 20 m por lado.","_nuevo":1},{"nombre":"Plancha con toque de hombros","grupo":"Core","equipo":"corporal","patron":"core","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"En plancha alta con los pies algo separados, toca con una mano el hombro contrario sin que la cadera se mueva. Alterna. 2 × 10 por lado.","_nuevo":1},{"nombre":"Split squat (zancada estática)","grupo":"Cuádriceps","grupos":"Glúteo, En casa","equipo":"corporal","patron":"zancada","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"sí","mancuernas":"no","indicaciones":"Un pie adelante y otro atrás, separados como un paso largo. Baja en vertical hasta que la rodilla de atrás casi toque el suelo y sube empujando con el pie de delante. El tronco, recto; los pies no se mueven.","_nuevo":1},{"nombre":"Split squat con mancuernas","grupo":"Cuádriceps","grupos":"Glúteo, En casa","equipo":"mancuernas","patron":"zancada","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"sí","mancuernas":"sí","indicaciones":"Como el split squat, con una mancuerna en cada mano y los brazos estirados. Baja en vertical, sin que la rodilla de delante se vaya hacia dentro, y sube empujando con el talón de delante.","_nuevo":1},{"nombre":"Hamstring walkouts","grupo":"Isquiosurales","grupos":"Glúteo, En casa","equipo":"corporal","patron":"puente","nivel":"intermedio","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Tumbado boca arriba, en puente de glúteos. Sin bajar la cadera, aleja los talones con pasitos cortos hasta casi estirar las piernas y vuelve igual. Si la cadera cae, acorta el recorrido.","_nuevo":1},{"nombre":"Ángeles invertidos boca abajo","grupo":"Espalda","grupos":"Hombro, En casa","equipo":"corporal","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Boca abajo, frente apoyada y brazos un poco despegados del suelo. Lleva las manos de las caderas hasta por encima de la cabeza dibujando un arco y vuelve, sin dejar de juntar las escápulas.","_nuevo":1},{"nombre":"Puente de glúteos a una pierna","grupo":"Glúteo","grupos":"Isquiosurales, En casa","equipo":"corporal","patron":"puente","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"sí","mancuernas":"no","indicaciones":"Boca arriba, un pie apoyado y la otra pierna estirada o recogida. Sube la cadera empujando con el talón hasta alinear rodilla, cadera y hombro, aprieta el glúteo un segundo y baja despacio. La cadera no se tuerce.","_nuevo":1},{"nombre":"Flexiones pseudo planche","grupo":"Pecho","grupos":"Hombro, En casa","equipo":"corporal","patron":"empuje_h","nivel":"avanzado","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"En posición de flexión con las manos a la altura de la cintura y los dedos hacia fuera o atrás. Echa el peso hacia delante, hombros por delante de las manos, y haz la flexión sin perder esa inclinación. Cuerpo en bloque.","_nuevo":1},{"nombre":"Sentadilla patinador (skater squat)","grupo":"Cuádriceps","grupos":"Glúteo, En casa","equipo":"corporal","patron":"sentadilla","nivel":"avanzado","modalidad":"fuerza","funcion":"principal","unilateral":"sí","mancuernas":"no","indicaciones":"De pie sobre una pierna, la otra doblada hacia atrás. Baja hasta que la rodilla de atrás roce el suelo (o un cojín) con el tronco algo inclinado y los brazos delante para equilibrarte, y sube con la pierna de apoyo.","_nuevo":1},{"nombre":"Sentadilla shrimp","grupo":"Cuádriceps","grupos":"Glúteo, En casa","equipo":"corporal","patron":"sentadilla","nivel":"avanzado","modalidad":"fuerza","funcion":"principal","unilateral":"sí","mancuernas":"no","indicaciones":"Sobre una pierna, agarra el pie de la otra por detrás con la mano del mismo lado. Baja hasta que la rodilla de atrás toque el suelo y sube sin apoyar el pie. Más fácil: sin agarrar el pie y con los brazos delante.","_nuevo":1},{"nombre":"Nórdico inverso","grupo":"Cuádriceps","grupos":"En casa","equipo":"corporal","patron":"aislamiento","nivel":"avanzado","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"De rodillas, tronco recto y cadera estirada (de rodillas a hombros en línea). Échate hacia atrás despacio sin doblar la cadera hasta donde controles y vuelve con los cuádriceps. Empieza con poco recorrido; con una almohada bajo las rodillas.","_nuevo":1},{"nombre":"Press de suelo con mancuernas","grupo":"Pecho","grupos":"Tríceps, En casa","equipo":"mancuernas","patron":"empuje_h","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"sí","indicaciones":"Tumbado boca arriba en el suelo, rodillas dobladas y una mancuerna en cada mano. Baja hasta que los brazos toquen el suelo, con los codos a unos 45° del cuerpo, y empuja hacia arriba hasta estirar.","_nuevo":1},{"nombre":"Crunch","grupo":"Core","grupos":"En casa","equipo":"corporal","patron":"core","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Boca arriba, rodillas dobladas y manos junto a las sienes o cruzadas en el pecho. Despega los hombros del suelo acercando las costillas a la cadera, sin tirar del cuello, y baja despacio. La zona lumbar no se despega.","_nuevo":1},{"nombre":"Sentadilla con banda","grupo":"Cuádriceps","grupos":"Glúteo, En casa","equipo":"banda","patron":"sentadilla","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"De pie sobre la banda, con los extremos a la altura de los hombros. Baja como en una sentadilla normal, rodillas en la dirección de los pies y talones apoyados, y sube estirando del todo. La banda tensa también arriba.","_nuevo":1},{"nombre":"Press de pecho con banda","grupo":"Pecho","grupos":"Tríceps, En casa","equipo":"banda","patron":"empuje_h","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"Banda anclada detrás a la altura del pecho, un extremo en cada mano. Da un paso adelante para tensarla y empuja las manos al frente hasta estirar los brazos; vuelve despacio sin dejar que tire de ti.","_nuevo":1},{"nombre":"Remo con banda","grupo":"Espalda","grupos":"Bíceps, En casa","equipo":"banda","patron":"tiron_h","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"Banda anclada delante a la altura del pecho (o alrededor de los pies, sentado). Tira de los extremos hacia el abdomen llevando los codos atrás y juntando las escápulas. Vuelve despacio.","_nuevo":1},{"nombre":"Remo unilateral con banda","grupo":"Espalda","grupos":"Bíceps, En casa","equipo":"banda","patron":"tiron_h","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"sí","mancuernas":"no","indicaciones":"Como el remo con banda, con un solo brazo. Tira del extremo hacia la cadera con el codo pegado y sin girar el tronco. Haz todas las de un lado y luego las del otro.","_nuevo":1},{"nombre":"Jalón con banda","grupo":"Espalda","grupos":"Bíceps, En casa","equipo":"banda","patron":"tiron_v","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"Banda anclada arriba (en la parte alta de una puerta). De rodillas o sentado, tira de los extremos hacia el pecho llevando los codos hacia abajo y atrás. Vuelve estirando los brazos sin soltar la tensión.","_nuevo":1},{"nombre":"Press de hombros con banda","grupo":"Hombro","grupos":"Tríceps, En casa","equipo":"banda","patron":"empuje_v","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"De pie sobre la banda, extremos a la altura de los hombros. Empuja hacia arriba hasta estirar los brazos sin arquear la espalda y baja despacio. Abdomen firme.","_nuevo":1},{"nombre":"Elevaciones laterales con banda","grupo":"Hombro","grupos":"En casa","equipo":"banda","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"De pie sobre la banda, un extremo en cada mano. Sube los brazos hacia los lados, con los codos un poco doblados, hasta la altura de los hombros. Baja despacio; no subas los hombros hacia las orejas.","_nuevo":1},{"nombre":"Curl de bíceps con banda","grupo":"Bíceps","grupos":"En casa","equipo":"banda","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"De pie sobre la banda, palmas hacia delante. Dobla los codos llevando las manos hacia los hombros sin mover los codos de los costados y baja despacio.","_nuevo":1},{"nombre":"Curl martillo con banda","grupo":"Bíceps","grupos":"En casa","equipo":"banda","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Como el curl con banda, con las palmas mirándose. Codos quietos junto al cuerpo; sube y baja controlando.","_nuevo":1},{"nombre":"Extensión de tríceps con banda","grupo":"Tríceps","grupos":"En casa","equipo":"banda","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Banda anclada arriba. Con los codos pegados al cuerpo, estira los brazos hacia abajo hasta bloquear y vuelve despacio hasta 90°. Solo se mueven los antebrazos.","_nuevo":1},{"nombre":"Extensión de tríceps sobre la cabeza con banda","grupo":"Tríceps","grupos":"En casa","equipo":"banda","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Pisa la banda por detrás (o ánclala abajo), extremos detrás de la cabeza. Estira los brazos hacia arriba con los codos apuntando al techo y baja despacio detrás de la cabeza.","_nuevo":1},{"nombre":"Peso muerto con banda","grupo":"Isquiosurales","grupos":"Glúteo, En casa","equipo":"banda","patron":"bisagra","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"De pie sobre la banda, extremos en las manos. Lleva la cadera atrás con la espalda recta y las rodillas algo dobladas y sube empujando el suelo hasta quedar erguido, apretando glúteos.","_nuevo":1},{"nombre":"Peso muerto rumano con banda","grupo":"Isquiosurales","grupos":"Glúteo, En casa","equipo":"banda","patron":"bisagra","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"Como el peso muerto con banda, con las rodillas casi estiradas: la cadera va atrás hasta notar los isquios estirados y vuelve. La espalda no se redondea.","_nuevo":1},{"nombre":"Hip thrust con banda","grupo":"Glúteo","grupos":"Isquiosurales, En casa","equipo":"banda","patron":"puente","nivel":"principiante","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"Espalda apoyada en el borde del sofá o un banco y la banda por encima de la cadera, sujeta con las manos o anclada al suelo. Sube la cadera hasta alinear rodillas, cadera y hombros, aprieta el glúteo y baja.","_nuevo":1},{"nombre":"Curl femoral con banda","grupo":"Isquiosurales","grupos":"En casa","equipo":"banda","patron":"aislamiento","nivel":"principiante","modalidad":"fuerza","funcion":"accesoria","unilateral":"no","mancuernas":"no","indicaciones":"Boca abajo, la banda anclada delante de ti y en los tobillos. Dobla las rodillas llevando los talones hacia el glúteo sin despegar la cadera y vuelve despacio.","_nuevo":1},{"nombre":"Flexiones con banda","grupo":"Pecho","grupos":"Tríceps, En casa","equipo":"banda","patron":"empuje_h","nivel":"intermedio","modalidad":"fuerza","funcion":"principal","unilateral":"no","mancuernas":"no","indicaciones":"Pasa la banda por la espalda, a la altura de los omóplatos, con un extremo en cada mano bajo las palmas. Haz la flexión normal: la banda añade resistencia arriba.","_nuevo":1}];

/* ---------- tu Comunidad: nombre, bloqueos, normas, salir y borrar ---------- */
A.cAjustes = function () { ir({ t: 'comuAjustes' }); };
VISTAS.comuAjustes = function () {
  var e = CMU().est || {}, B = e.bloqueados || [];
  var h = '<div class="pant pad">' + cab('Tu Comunidad');
  h += '<div class="kpis k3">' + [[e.pubs || 0, (e.pubs === 1 ? 'publicación' : 'publicaciones')], [e.siguiendo || 0, 'siguiendo'], [e.seguidores || 0, (e.seguidores === 1 ? 'seguidor' : 'seguidores')]].map(function (k) { return '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('') + '</div>';
  h += '<form class="card" data-f="cNombre"><label class="f">Tu nombre en Comunidad<input name="n" maxlength="30" value="' + esc(e.nombre || '') + '" autocomplete="off"></label><small class="mut">Es lo único tuyo que ven los demás, junto a lo que publiques.</small><button class="btn sec" type="submit">Guardar el nombre</button></form>';
  h += '<b class="tit-sec">PERSONAS BLOQUEADAS</b><section class="card cm-lista">' + (B.length ? B.map(function (b) {
    return '<div class="cm-fila"><span class="cm-av">' + esc(iniciales(b.nombre)) + '</span><span class="fr-t"><b>' + esc(b.nombre) + '</b></span><button class="btn-o" data-a="cDesbloquear" data-p="' + esc(b.pid) + '">Desbloquear</button></div>'; }).join('') : '<small class="mut">No has bloqueado a nadie.</small>') + '</section>';
  h += '<b class="tit-sec">NORMAS Y PRIVACIDAD</b><section class="card"><a class="fila-b" href="../../condiciones.html#comunidad" target="_blank" rel="noopener"><b>Normas de la Comunidad</b><small>Las aceptaste al entrar</small></a><a class="fila-b" href="../../privacidad.html#yo" target="_blank" rel="noopener"><b>Qué ven los demás</b><small>Política de privacidad</small></a></section>';
  h += '<b class="tit-sec">SALIR</b><section class="card"><button class="fila-b" data-a="cDesactivar"><b>Salir de Comunidad</b><small>Tus publicaciones dejan de verse. Puedes volver cuando quieras.</small></button><button class="fila-b rojo" data-a="cBorrarTodo"><b>Borrar todo lo mío en Comunidad</b><small>Publicaciones, comentarios, me gusta y a quién sigues</small></button></section>';
  return h + '</div>';
};
F.cNombre = function (f) {
  var C = CMU(), n = String(f.elements.n.value || '').replace(/\s+/g, ' ').trim(), b = f.querySelector('button');
  if (n.length < 2 || n.length > 30 || !NOM_RE.test(n)) return toast('Escribe un nombre de 2 a 30 letras (sin números ni símbolos)');
  if (C.est && n === C.est.nombre) return toast('Ese ya es tu nombre');
  b.disabled = true;
  rpc('yo_comu_activar', { nombre: n, normas: (C.est && C.est.normas) || COMU_NV }).then(function (e) { C.est = e; olvidaFeeds(); C.pers = {}; toast('Nombre guardado', 'ok'); pintar(); }, function (e) { b.disabled = false; toast(cErr(e)); });
};
A.cDesactivar = function () {
  hoja('<h2>¿Salir de Comunidad?</h2><p class="mut">Tus publicaciones y tu nombre dejan de verse, y no verás la Comunidad. No se borra nada: si vuelves, estará todo como lo dejaste.</p><button class="btn" data-a="cDesactivarSi">Salir de Comunidad</button><button class="btn sec" data-a="cerrarHoja">Cancelar</button>');
};
A.cDesactivarSi = function (el) {
  var C = CMU(); if (el.disabled) return; el.disabled = true;
  rpc('yo_comu_desactivar').then(function (e) { cerrarHoja(); C.est = e; olvidaFeeds(); C.pers = {}; irTab('comu'); toast('Has salido de Comunidad'); }, function (e) { el.disabled = false; toast(cErr(e)); });
};
A.cBorrarTodo = function () {
  hoja('<h2>¿Borrar todo lo tuyo en Comunidad?</h2><p class="mut">Se borra al momento y <b>no se puede recuperar</b>:</p><div class="borra-l">' +
    ['Tus publicaciones, con sus comentarios y me gusta', 'Tus comentarios y tus me gusta', 'A quién sigues y quién te sigue', 'Tu nombre en Comunidad'].map(function (t) { return '<span>' + ic('x', 15, 'var(--rojo)', 2.6) + '<span>' + t + '</span></span>'; }).join('') +
    '</div><p class="mut sm">Tus entrenos, tus rutinas y tu progreso no se tocan.</p><label class="chk"><input type="checkbox" id="cbt-ok" data-ch="cbtOk"><span>Entiendo que no se puede deshacer</span></label>' +
    '<button class="btn rojo" id="cbt-go" data-a="cBorrarTodoSi" disabled>Borrar todo lo mío en Comunidad</button><button class="btn sec" data-a="cerrarHoja">Cancelar</button>');
};
CH.cbtOk = function (t) { var b = $('#cbt-go'); if (b) b.disabled = !t.checked; };
A.cBorrarTodoSi = function (el) {
  if (!$('#cbt-ok') || !$('#cbt-ok').checked || el.disabled) return; el.disabled = true; el.textContent = 'Borrando…';
  rpc('yo_comu_borrar_todo').then(function () { cerrarHoja(); S.comu = null; CMU().est = null; irTab('comu'); toast('Hemos borrado todo lo tuyo en Comunidad'); },
    function (e) { el.disabled = false; el.textContent = 'Borrar todo lo mío en Comunidad'; toast(cErr(e)); });
};

/* ---------- publicar un entreno (desde el fin del entreno o desde el entreno en Progreso) ---------- */
function pubDe(U) {
  var R = U.recs || [], r = R[0], rec = r ? r.e + ' ' + (r.p ? fN(r.p) + ' kg × ' : '') + r.r + (R.length > 1 ? ' (y ' + (R.length - 1) + (R.length === 2 ? ' más)' : ' más)') : '') : '';
  var ej = (U.ej || []).filter(function (e) { return e.tipo !== 'run' && e.tipo !== 'cardio' && (e.sets || []).length; }).slice(0, 30).map(function (e) { var s0 = e.sets[0] || {}; return { n: String(e.n).slice(0, 80), u: e.u || '', s: e.sets.length, r: String(s0.reps || '10').slice(0, 10) }; });
  return { t: String(U.nombre || 'Entreno').slice(0, 60), min: U.min || 0, nser: U.nser || 0, vol: U.vol || 0, rec: rec.slice(0, 80), rut: { ej: ej } };
}
A.finComu = function () {
  var C = CMU(), U = S.fin; if (!U) return;
  if (U.pub) return toast('Este entreno ya está en la Comunidad');
  if (C.est === undefined) return rpc('yo_comu_estado').then(function (e) { C.est = e || null; A.finComu(); }, function (e) { toast(cErr(e)); });
  if (C.est && C.est.activo && C.est.suspendido) return toast('Tu cuenta de Comunidad está suspendida');
  if (!comuActiva()) return hoja('<h2>Publicar en la Comunidad</h2><p class="mut">Para publicar tus entrenos, primero entra en la Comunidad: eliges el nombre que verán los demás y aceptas las normas.</p><button class="btn" data-a="cIrActivar">' + (C.est ? 'Volver a la Comunidad' : 'Activar Comunidad') + '</button><button class="btn sec" data-a="cerrarHoja">Ahora no</button>');
  S.x.cpub = pubDe(U); S.x.cpub.cop = true; if (CPF) { URL.revokeObjectURL(CPF.url); CPF = null; } pintaPub();
};
function pintaPub() {
  var C = CMU(), d = S.x.cpub, n = d.rut ? d.rut.ej.length : 0;
  var x = { id: 0, pid: C.est.pid, nombre: C.est.nombre, creado: new Date().toISOString(), t: d.t, min: d.min, nser: d.nser, vol: d.vol, rec: d.rec, nej: d.cop ? n : 0, likes: 0, coms: 0, mio: true };
  hoja('<h2>Publicar en la Comunidad</h2><p class="mut sm">Así lo verá la gente de la Comunidad:</p>' + cardPub(x, true) +
    '<label class="f">Título<input id="cp-t" maxlength="60" value="' + esc(d.t) + '" data-in="cpTit"></label>' + cpfHtml() +
    (n ? '<label class="chk"><input type="checkbox" id="cp-rut"' + (d.cop ? ' checked' : '') + ' data-ch="cpRut"><span>Dejar que copien la rutina (' + n + (n === 1 ? ' ejercicio' : ' ejercicios') + ', con sus series y repeticiones, sin tus pesos)</span></label>' : '') +
    '<p class="cm-nunca">' + ic('escudo', 15) + '<span>No sale tu peso, ni tus fotos de progreso, ni lo que comes.</span></p>' +
    '<button class="btn" data-a="cPublicar">Publicar</button><button class="btn sec" data-a="cerrarHoja">Cancelar</button>');
  cpfEnganchar();
}
IN.cpTit = function (t) { if (S.x.cpub) S.x.cpub.t = t.value; var b = document.querySelector('.cm-pub.prev .cm-t'); if (b) b.textContent = t.value.trim() || ' '; };
CH.cpRut = function (t) { if (S.x.cpub) S.x.cpub.cop = t.checked; var s = document.querySelector('.cm-pub.prev .cm-cop'); if (s) s.textContent = t.checked ? 'Se podrá copiar la rutina' : 'Sin rutina para copiar'; };
A.cPublicar = function (el) {
  var U = S.fin, d = S.x.cpub, C = CMU(); if (!U || !d || el.disabled) return;
  var t = String(($('#cp-t') || {}).value || '').trim(); if (!t) return toast('Ponle un título');
  var dd = { t: t.slice(0, 60), min: d.min, nser: d.nser, vol: d.vol, rec: d.rec }; if (d.rut && $('#cp-rut') && $('#cp-rut').checked) dd.rut = d.rut;
  var foto = CPF ? cpfJpeg() : null;
  el.disabled = true; el.textContent = 'Publicando…';
  rpc('yo_comu_publicar', { sid: U.id, d: dd }).then(function (r) {
    var id = r && r.id, fin = function (msg, cls) { cerrarHoja(); if (CPF) { URL.revokeObjectURL(CPF.url); CPF = null; } U.pub = id || 1; olvidaFeeds(); if (C.est) C.est.pubs = (C.est.pubs || 0) + 1; C.pers = {}; toast(msg, cls); pintar(); };
    if (!foto || !id) return fin('Publicado en la Comunidad', 'ok');
    el.textContent = 'Subiendo la foto…';
    rpc('yo_comu_foto_poner', { pub: id, foto: foto }).then(function () { C.fotos = C.fotos || {}; C.fotos[id] = foto; fin('Publicado en la Comunidad, con tu foto', 'ok'); },
      function () { fin('Publicado, pero la foto no se ha podido subir'); });
  }, function (e) {
    var m = cErr(e); if (/ya está publicado/.test(m)) { cerrarHoja(); U.pub = 1; pintar(); return toast('Este entreno ya estaba en la Comunidad'); }
    el.disabled = false; el.textContent = 'Publicar'; toast(m);
  });
};

/* ---------- la foto de una publicación: opcional; se coloca (arrastrar y zoom) en 4:5 y se reduce a 864 × 1080 en JPEG.
   Al volver a dibujarla en el móvil pierde la ubicación y los datos de la cámara (EXIF). Se guarda aparte (indep.comu_foto, 007)
   y solo se pide al verla (yo_comu_foto), con las mismas reglas que la publicación ---------- */
var CPF = null, CPF_W = 240, CPF_H = 300;
function cpfHtml() {
  if (!CPF) return '<label class="btn sec cp-foto">' + ic('foto', 18) + 'Añadir una foto (opcional)<input type="file" accept="image/*" data-ch="cpFoto" hidden></label>';
  return '<div class="cp-f"><div class="crop cp-crop" id="cp-crop" style="width:' + CPF_W + 'px;height:' + CPF_H + 'px"><img id="cp-i" src="' + CPF.url + '" alt="" draggable="false"></div>' +
    '<label class="f crop-z">Zoom<input type="range" min="1" max="3" step="0.01" value="' + CPF.z + '" data-in="cpZ" aria-label="Zoom de la foto"></label><small class="mut">Arrastra la foto para colocarla.</small>' +
    '<button class="link rojo-t izq" data-a="cpFotoQuitar">Quitar la foto</button></div>' +
    '<p class="cm-nunca">' + ic('escudo', 15) + '<span>La verán las personas de la Comunidad. Le quitamos la ubicación y los datos de la cámara. No subas fotos de otras personas sin su permiso.</span></p>';
}
CH.cpFoto = function (t) {
  var f = t.files && t.files[0]; t.value = ''; if (!f) return; if (!/^image\//.test(f.type || 'image/')) return toast('Elige una imagen');
  var u = URL.createObjectURL(f), im = new Image();
  im.onload = function () { CPF = { im: im, url: u, z: 1, x: 0, y: 0, s0: Math.max(CPF_W / im.width, CPF_H / im.height) }; pintaPub(); };
  im.onerror = function () { URL.revokeObjectURL(u); toast('No se ha podido abrir esa foto'); };
  im.src = u;
};
A.cpFotoQuitar = function () { if (CPF) URL.revokeObjectURL(CPF.url); CPF = null; pintaPub(); };
function cpfLim() { var C = CPF, W = C.im.width * C.s0 * C.z, H = C.im.height * C.s0 * C.z; C.x = Math.max(-(W - CPF_W) / 2, Math.min((W - CPF_W) / 2, C.x)); C.y = Math.max(-(H - CPF_H) / 2, Math.min((H - CPF_H) / 2, C.y)); return { W: W, H: H }; }
function cpfPinta() {
  var C = CPF, i = $('#cp-i'); if (!C || !i) return; var d = cpfLim();
  i.style.width = d.W + 'px'; i.style.height = d.H + 'px'; i.style.left = (CPF_W / 2 + C.x - d.W / 2) + 'px'; i.style.top = (CPF_H / 2 + C.y - d.H / 2) + 'px';
  var pv = $('#cp-prev-img'); if (pv && !cpfPinta.t) cpfPinta.t = setTimeout(function () { cpfPinta.t = 0; var q = $('#cp-prev-img'); if (q && CPF) q.src = cpfJpeg(0.6, 0.4); }, 120);
}
function cpfEnganchar() {
  var box = $('#cp-crop'); if (!box || !CPF) return; cpfPinta(); var ini = null;
  box.addEventListener('pointerdown', function (ev) { ini = { px: ev.clientX, py: ev.clientY, x: CPF.x, y: CPF.y }; try { box.setPointerCapture(ev.pointerId); } catch (e) { } ev.preventDefault(); });
  box.addEventListener('pointermove', function (ev) { if (!ini) return; CPF.x = ini.x + ev.clientX - ini.px; CPF.y = ini.y + ev.clientY - ini.py; cpfPinta(); });
  var fin = function () { ini = null; }; box.addEventListener('pointerup', fin); box.addEventListener('pointercancel', fin);
}
IN.cpZ = function (t) { if (!CPF) return; CPF.z = +t.value || 1; cpfPinta(); };
function cpfJpeg(q, esc_) {
  var C = CPF, d = cpfLim(), k = (esc_ || 1) * 1080 / CPF_H, W = Math.round(CPF_W * k), H = Math.round(CPF_H * k), cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var x = cv.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, W, H); x.drawImage(C.im, (CPF_W / 2 + C.x - d.W / 2) * k, (CPF_H / 2 + C.y - d.H / 2) * k, d.W * k, d.H * k);
  var u = cv.toDataURL('image/jpeg', q || 0.75); if (!esc_ && u.length > 360000) u = cv.toDataURL('image/jpeg', 0.6); if (!esc_ && u.length > 360000) u = cv.toDataURL('image/jpeg', 0.45); return u;
}
/* las fotos del feed: se piden una vez cada una, al pintarse */
function cargaFotosComu() {
  var C = CMU(); C.fotos = C.fotos || {}; C.fotoPide = C.fotoPide || {};
  Array.prototype.forEach.call(document.querySelectorAll('.cm-foto[data-pf]:not(.ok)'), function (el) {
    var id = el.getAttribute('data-pf'); if (C.fotos[id]) { el.classList.add('ok'); el.innerHTML = '<img src="' + C.fotos[id] + '" alt="">'; return; }
    if (C.fotoPide[id]) return; C.fotoPide[id] = 1;
    rpc('yo_comu_foto', { pub: +id }).then(function (f) { if (!f) return; C.fotos[id] = f; Array.prototype.forEach.call(document.querySelectorAll('.cm-foto[data-pf="' + id + '"]'), function (e2) { e2.classList.add('ok'); e2.innerHTML = '<img src="' + f + '" alt="">'; }); }, function () { C.fotoPide[id] = 0; });
  });
}

arrancar();
</script>
