  function otra(n){ if(n<4) setTimeout(function(){ comprobar(n+1); },1500); else { $('env').disabled=false; msg('No se ha podido enviar. Comprueba la conexión y vuelve a pulsar Enviar. Si ha pasado mucho rato, vuelve a la app y toca otra vez el micrófono.','err'); } }
  $('mic').onclick=grabar; $('rep').onclick=repetir; $('env').onclick=enviar;
})();
} else (function () {
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  var q = location.search || '';
  f.src = APP + q;
  function listo() { sp.className = 'fuera'; }
  setTimeout(listo, 9000);
  f.addEventListener('load', function () { setTimeout(listo, 2500); });

  /* icono para la pantalla de inicio del móvil */
  try {
    var cv = document.createElement('canvas'); cv.width = cv.height = 180; var x = cv.getContext('2d');
    x.fillStyle = '#111111'; x.fillRect(0, 0, 180, 180);
    x.save(); x.translate(34, 66.06); x.scale(0.1400, 0.1400); x.fillStyle = '#FFFFFF';
    x.fill(new Path2D('M601 340.9C579.8 338.5 558.1 331.9 538.4 322C519.7 312.6 508 304.1 492.4 288.5C473 269.1 459.4 247.4 451.1 222.4C448.2 213.3 444 194.2 444 189.4L444 187L472.7 187.2L501.3 187.5L503.1 195.5C519.2 270.3 597.8 311.5 668.5 282.3C702.4 268.3 728.7 237.6 738.7 200.3C741.2 191.3 741.4 189 741.4 171C741.4 153 741.2 150.7 738.7 141.7C729.9 108.8 709.6 82.3 681 66.1C627.3 35.6 559.8 50.3 523.4 100.4C514.3 112.8 505.9 132.3 502.7 148L501.4 154.5L472.7 154.8L444 155L444 152.6C444 147.8 448.2 128.7 451.1 119.6C459.4 94.6 473 72.9 492.4 53.5C508 37.9 519.7 29.4 538.4 20C602.9 -12.5 679.9 -4.7 735.9 40C768.1 65.7 788.9 100.1 797.2 141.1C800.4 157.4 800.4 184.6 797.2 200.9C786.1 255.9 751.7 299.8 700.5 324.1C669.9 338.6 634.2 344.6 601 340.9ZM-0 170.9C-0 39.2 0.3 6 1.2 6.6C1.9 7.1 47.2 41.1 101.8 82.2C165.5 130.3 201.5 156.8 202.3 156.3C202.9 155.9 248.1 121.9 302.7 80.8C357.2 39.7 402 6 402.2 6C402.4 6 402.5 80.2 402.5 171L402.5 336L373.8 336L345 336L344.8 227L344.5 118.1L321 135.8C308.1 145.5 275.8 169.8 249.4 189.8L201.3 226.1L129.9 172.2L58.5 118.4L58.2 227.2L58 336L29 336L0 336L-0 170.9Z'), 'evenodd');
    x.restore();
    document.getElementById('ati').href = cv.toDataURL('image/png');
  } catch (e) {}

  /* mensajes de la app: está lista, mensajes sin leer (número en la pestaña) y avisos */
  var SES = { cl: 'mo_ses_cl', co: 'mo_ses_co', dcl: 'mo_disp_cl', dco: 'mo_disp_co' };
  function deAqui(e) { try { return !!e.source && e.source.top === window; } catch (er) { return false; } }
  var esCoach = /[?&]coach(=|&|$)/.test(q);
  window.addEventListener('message', function (e) {
    var o = String(e.origin || '');
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(o) && !/^http:\/\/localhost(:\d+)?$/.test(o)) return;
    var d = e.data; if (!d || !d.chadinfit) return;
    if (d.listo) listo();
    /* v28: la sesión se recuerda aquí (en el iPhone, lo que guarda el marco de Google se borra al cerrar Safari).
       Solo se la damos a la app que va dentro de esta página. */
    if ((d.pideSes || d.guarda) && deAqui(e)) {
      if (d.guarda && SES[d.guarda.k]) { try { if (d.guarda.v) localStorage.setItem(SES[d.guarda.k], JSON.stringify(d.guarda.v)); else localStorage.removeItem(SES[d.guarda.k]); } catch (er) {} }
      if (d.pideSes) { var r = {}; Object.keys(SES).forEach(function (k) { try { var v = localStorage.getItem(SES[k]); if (v) r[k] = JSON.parse(v); } catch (er) {} }); try { e.source.postMessage({ chadinfit: 1, sesiones: r, cap: ['compartir'] }, o); } catch (er) {} }
    }
    /* v32: después de crear la contraseña (o con un enlace ya usado) se quita ?alta= / ?reset= de la dirección: si la fija en el inicio del móvil, no vuelve a abrir el enlace */
    if (d.limpia && deAqui(e)) { try { var u = new URL(location.href); ['alta', 'reset', 'clienta'].forEach(function (k) { u.searchParams.delete(k); }); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (er) {} }
    if (d.compartir && deAqui(e) && /^data:image\/png;base64,/.test(String(d.compartir.img || ''))) compartir(d.compartir);
    if (typeof d.noLeidos === 'number') {
      document.title = (d.noLeidos ? '(' + d.noLeidos + ') ' : '') + 'MOOD ON';
      try { if (navigator.setAppBadge) { if (d.noLeidos) navigator.setAppBadge(d.noLeidos); else navigator.clearAppBadge(); } } catch (er) {}
    }
    if (d.aviso && esCoach && 'Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
      try { var n = new Notification(d.aviso.titulo || 'MOOD ON', { body: d.aviso.texto || '', tag: 'chadinfit-msg', renotify: true }); n.onclick = function () { window.focus(); n.close(); }; } catch (er) {}
    }
  });

  /* v31: compartir el entreno (historias de Instagram, WhatsApp…), guardar la imagen o copiarla para pegarla encima de tu foto */
  function compartir(c) {
    var ov = document.getElementById('sh'); if (ov) ov.parentNode.removeChild(ov);
    ov = document.createElement('div'); ov.id = 'sh';
    ov.innerHTML = '<div class="sh-b"></div><div class="sh-c"><div class="sh-img' + (c.modo === 'trans' ? ' tr' : '') + '"><img alt="Tu entreno"></div>' +
      '<div class="sh-acc"><button id="sh-s">Compartir en historias</button><button id="sh-c" class="sec">Copiar para pegar en tu historia</button><a id="sh-d" class="sec" download>Guardar imagen</a><button id="sh-x" class="sec">Cerrar</button></div><p id="sh-t"></p></div>';
    document.body.appendChild(ov);
    var tip = function (t) { ov.querySelector('#sh-t').textContent = t; };
    var cerrar = function () { if (ov.parentNode) ov.parentNode.removeChild(ov); };
    ov.querySelector('.sh-b').onclick = cerrar; ov.querySelector('#sh-x').onclick = cerrar;
    fetch(c.img).then(function (r) { return r.blob(); }).then(function (b) {
      var u = URL.createObjectURL(b), f = null, nom = String(c.nombre || 'MOOD_ON.png').replace(/[^\w.\-]/g, '_');
      try { f = new File([b], nom, { type: 'image/png' }); } catch (er) {}
      ov.querySelector('img').src = u;
      var dl = ov.querySelector('#sh-d'); dl.href = u; dl.setAttribute('download', nom);
      var sb = ov.querySelector('#sh-s'), cb = ov.querySelector('#sh-c');
      var puede = false; try { puede = !!(f && navigator.canShare && navigator.canShare({ files: [f] })); } catch (er) {}
      if (!puede) sb.style.display = 'none';
      if (!(c.modo === 'trans' && navigator.clipboard && window.ClipboardItem)) cb.style.display = 'none';
      sb.onclick = function () { navigator.share({ files: [f], title: 'Mi entreno', text: '#MOODON' }).catch(function () {}); };
      cb.onclick = function () { navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]).then(function () { tip('Copiada. En Instagram: crea tu historia con tu foto del gimnasio, mantén pulsado y elige «Pegar».'); }, function () { tip('No se ha podido copiar: guárdala y añádela en tu historia.'); }); };
      tip(puede ? 'Elige Instagram → Historia (o WhatsApp). Si no te sale, guarda la imagen y súbela desde tus fotos.' : 'Mantén pulsada la imagen y elige «Guardar» o «Compartir», o toca «Guardar imagen».');
      if (c.acc === 'compartir' && puede) { try { if (navigator.userActivation && navigator.userActivation.isActive) sb.click(); } catch (er) {} }
    }).catch(function () { tip('No se ha podido preparar la imagen.'); });
  }

  /* la coach puede activar los avisos del navegador (mensajes nuevos con la pestaña en segundo plano) */
  var av = document.getElementById('avisos');
  var ya = false; try { ya = localStorage.getItem('chadin_avisos') === 'no'; } catch (e) {}
  if (esCoach && 'Notification' in window && Notification.permission === 'default' && !ya) {
    setTimeout(function () { av.style.display = 'flex'; }, 4000);
    document.getElementById('av-si').onclick = function () { av.style.display = 'none'; try { Notification.requestPermission(); } catch (e) {} };
    document.getElementById('av-no').onclick = function () { av.style.display = 'none'; try { localStorage.setItem('chadin_avisos', 'no'); } catch (e) {} };
  }
})();
